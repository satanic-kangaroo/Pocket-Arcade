<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥞 Pancake Tower</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Press Start 2P', cursive;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  .btn3d { box-shadow: 0 4px 0 0 rgba(0,0,0,.22); }
  .btn3d:active { transform: translateY(2px); box-shadow: 0 2px 0 0 rgba(0,0,0,.22); }
</style>
</head>
<body class="bg-gradient-to-b from-amber-100 via-rose-100 to-rose-200 min-h-screen flex flex-col items-center justify-center p-2 md:p-4 text-slate-800">

<div class="w-full max-w-[400px] bg-white/80 backdrop-blur rounded-3xl p-3 shadow-2xl border-4 border-white flex flex-col items-center">

  <!-- ═══ هدر ═══ -->
  <div class="w-full flex justify-between items-center mb-2 px-1">
    <div class="flex items-center gap-1.5 text-amber-700">
      <span class="text-base">🥞</span>
      <span class="text-[9px] font-bold tracking-wide">PANCAKE TOWER</span>
    </div>
    <div class="flex gap-2 bg-white/80 px-2 py-1 rounded-lg border border-amber-200 text-[9px] text-amber-700">
      <div>HI <span id="best" class="text-amber-500">0000</span></div>
      <div>★ <span id="score" class="text-rose-500">0000</span></div>
    </div>
  </div>

  <!-- ═══ صحنه ═══ -->
  <div id="stage" class="relative w-full aspect-[7/10] bg-amber-50 rounded-2xl overflow-hidden border-2 border-amber-200">
    <canvas id="game" class="w-full h-full"></canvas>

    <!-- استارت -->
    <div id="startModal" class="absolute inset-0 bg-amber-900/10 backdrop-blur-[2px] flex items-center justify-center p-4">
      <div class="bg-white/95 px-5 py-5 rounded-2xl shadow-xl border border-amber-200 text-center max-w-[250px]">
        <div class="text-3xl mb-2">🥞</div>
        <p class="text-[9px] font-bold text-amber-700 mb-3 leading-relaxed">دکمه رو بزن تا پنکیک بندازی</p>
        <div class="flex justify-center gap-2 text-[8px] text-slate-500">
          <span class="bg-slate-100 px-2 py-1 rounded border">Space</span>
          <span class="bg-slate-100 px-2 py-1 rounded border">لمس</span>
        </div>
      </div>
    </div>

    <!-- پایان -->
    <div id="overModal" class="hidden absolute inset-0 bg-slate-900/45 backdrop-blur-sm flex flex-col items-center justify-center text-white p-4">
      <div class="text-4xl mb-1">😵</div>
      <h2 class="text-lg text-rose-300 mb-1 font-bold tracking-wider drop-shadow">CRASH!</h2>
      <p class="text-[9px] text-amber-100 mb-3">برج فرو ریخت</p>
      <div class="text-[10px] text-white/85 mb-5">ارتفاع: <span id="finalH" class="text-amber-300">0</span></div>
      <button id="restartBtn" class="btn3d bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-5 rounded-xl transition text-[9px]">
        دوباره (Space)
      </button>
    </div>
  </div>

  <!-- دکمه موبایل -->
  <button id="dropBtn" class="btn3d w-full mt-3 md:hidden bg-amber-500 text-white font-bold py-4 rounded-2xl text-[10px]">
    ⬇ بنداز
  </button>

  <div class="mt-2 text-[8px] text-amber-400">HTML5 Canvas — صفر فایل خارجی</div>
</div>

<script>
(function () {
'use strict';

/* ══════════════════════════════════════════
   ۱) بوم
   ══════════════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 420, H = 600;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

// پالی‌فیل roundRect برای مرورگرهای قدیمی
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.arcTo(x + w, y, x + w, y + h, tr);
    this.arcTo(x + w, y + h, x, y + h, br);
    this.arcTo(x, y + h, x, y, bl);
    this.arcTo(x, y, x + w, y, tl);
    this.closePath();
    return this;
  };
}

/* ══════════════════════════════════════════
   ۲) DOM
   ══════════════════════════════════════════ */
const $score   = document.getElementById('score');
const $best    = document.getElementById('best');
const $start   = document.getElementById('startModal');
const $over    = document.getElementById('overModal');
const $finalH  = document.getElementById('finalH');
const $stage   = document.getElementById('stage');
const $drop    = document.getElementById('dropBtn');

/* ══════════════════════════════════════════
   ۳) ثابت‌ها
   ══════════════════════════════════════════ */
const TAU = Math.PI * 2;
const LAYER_H     = 32;    // ارتفاع هر پنکیک
const BASE_W      = 200;   // عرض پنکیک پایه
const BASE_Y      = 500;   // y بالای پنکیک پایه در مختصات جهانی
const CAM_TARGET  = 200;   // نقطه‌ای که نوک برج در آن ثابت می‌مونه
const PERFECT_TOL = 6;     // آستانه‌ی «کامل»
const SPEED_MIN   = 2.4;
const SPEED_MAX   = 6.6;
const SPEED_STEP  = 0.1;

// پالت رنگ پنکیک‌ها (صورتی، هلو، کره، نعنا، آبی، یاسی)
const COLORS = [
  { body: '#FFB5C5', top: '#FFDCE5', bot: '#E88AA4' },
  { body: '#FFD4A3', top: '#FFEBD1', bot: '#E0A96F' },
  { body: '#FFF0A0', top: '#FFFAD2', bot: '#DDC95E' },
  { body: '#B5E8B5', top: '#DBF6DB', bot: '#7FC77F' },
  { body: '#B5D8F0', top: '#DCEDFA', bot: '#7FAAD2' },
  { body: '#D8B5F0', top: '#EEDBF9', bot: '#A87FD2' },
];

/* ══════════════════════════════════════════
   ۴) ابزار
   ══════════════════════════════════════════ */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pad(n, l) { return String(Math.floor(n)).padStart(l, '0'); }

/* ══════════════════════════════════════════
   ۵) وضعیت
   ══════════════════════════════════════════ */
const READY = 0, PLAY = 1, DYING = 2, OVER = 3;
let state = READY;

let stack = [];         // لایه‌های چیده‌شده
let current = null;     // لایه‌ی در حال حرکت
let dyingLayer = null;  // لایه‌ای که رد شده و داره میفته
let particles = [];
let floats = [];
let camY = 0;           // آفست دوربین
let shake = 0;
let speed = SPEED_MIN;
let score = 0;
let combo = 0;
let frame = 0;
let spawnDir = 1;       // ۱ = از چپ، ‎-۱ = از راست
let dyingT = 0;
let bgDots = [];
let best = Number(localStorage.getItem('pancake_best')) || 0;

$best.textContent = pad(best, 4);

/* ══════════════════════════════════════════
   ۶) صدا (بدون فایل)
   ══════════════════════════════════════════ */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function sfxPlace()   { tone(220, 0.09, 'square', 0.04, 140); }
function sfxPerfect() {
  tone(660, 0.08, 'sine', 0.05);
  setTimeout(() => tone(990, 0.1, 'sine', 0.05), 60);
  setTimeout(() => tone(1320, 0.13, 'sine', 0.045), 130);
}
function sfxMiss() {
  tone(300, 0.4, 'sawtooth', 0.07, 60);
}

/* ══════════════════════════════════════════
   ۷) ذرات و متن‌های شناور
   ══════════════════════════════════════════ */
function burst(x, y, n, spread, spMin, spMax, colors, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(spMin, spMax);
    particles.push({
      x: x + rand(-spread, spread),
      y: y + rand(-spread, spread),
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      life: 1,
      size: rand(2, 5),
      col: colors[(Math.random() * colors.length) | 0],
      grav: grav == null ? 0.05 : grav
    });
  }
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.98;
    p.life -= 0.032;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.size * p.life), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function addFloat(x, y, text, color, size) {
  floats.push({ x, y, text, color, size: size || 13, life: 1, vy: -1.1 });
}
function updateFloats() {
  for (const f of floats) { f.y += f.vy; f.vy *= 0.97; f.life -= 0.018; }
  floats = floats.filter(f => f.life > 0);
}
function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.4));
    ctx.font = 'bold ' + f.size + "px 'Press Start 2P', monospace";
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════
   ۸) منطق لایه‌ها
   ══════════════════════════════════════════ */
function makeBaseLayer() {
  return {
    x: (W - BASE_W) / 2,
    w: BASE_W,
    y: BASE_Y,
    colorIdx: 0
  };
}

function spawnLayer() {
  const top = stack[stack.length - 1];
  const w = top.w;
  const y = top.y - LAYER_H;
  const startX = spawnDir > 0 ? 0 : W - w;
  current = {
    x: startX,
    w: w,
    y: y,
    colorIdx: stack.length % COLORS.length,
    vx: spawnDir * speed
  };
  spawnDir *= -1;   // لایه‌ی بعدی از سمت مخالف
}

function drop() {
  if (state !== PLAY || !current) return;

  const top = stack[stack.length - 1];

  // هم‌پوشانی افقی
  const overlapL = Math.max(current.x, top.x);
  const overlapR = Math.min(current.x + current.w, top.x + top.w);
  const overlap = overlapR - overlapL;

  // ─── رد شد! ───
  if (overlap <= 4) { missLayer(); return; }

  const dx = Math.abs(current.x - top.x);
  const isPerfect = dx <= PERFECT_TOL;

  let newX, newW;

  if (isPerfect) {
    // کامل: همون‌جا قفل کن، کمی هم بزرگ‌تر شو
    newX = top.x;
    newW = Math.min(top.w + 5, BASE_W);
    combo++;
    score += 10 * combo;
    const cx = newX + newW / 2;
    perfectFx(cx, current.y);
    sfxPerfect();
    shake = 7;
  } else {
    newX = overlapL;
    newW = overlap;
    combo = 0;
    score += 1;
    sfxPlace();
    shake = 3.5;
    // براده‌های پنکیک که به اطراف می‌پرن
    const cutSide = current.x < top.x ? newX + newW : newX;
    burst(cutSide, current.y + LAYER_H / 2, 8, 6, 1, 3.2,
          ['#F5E0B8', '#E8C48F', '#FFFFFF'], 0.12);
  }

  stack.push({
    x: newX,
    w: newW,
    y: current.y,
    colorIdx: current.colorIdx
  });

  // سرعت بیشتر
  speed = Math.min(SPEED_MAX, speed + SPEED_STEP);

  $score.textContent = pad(score, 4);
  current = null;
  spawnLayer();
}

function missLayer() {
  state = DYING;
  dyingT = 0;
  dyingLayer = {
    x: current.x,
    y: current.y,
    w: current.w,
    colorIdx: current.colorIdx,
    vy: -1,
    vx: (Math.random() - 0.5) * 3,
    rot: 0,
    vr: rand(-0.14, 0.14)
  };
  current = null;
  shake = 14;
  combo = 0;
  sfxMiss();
}

function perfectFx(cx, cy) {
  burst(cx, cy + LAYER_H / 2, 18, 14, 1.2, 4.2,
        ['#FFD23F', '#FFF3B0', '#FFFFFF', '#FFA94D'], 0.04);
  const label = combo > 1 ? 'PERFECT ×' + combo : 'PERFECT!';
  addFloat(cx, cy + camY - 6, label, '#E8A400', combo > 1 ? 15 : 13);
}

/* ══════════════════════════════════════════
   ۹) رسم پس‌زمینه
   ══════════════════════════════════════════ */
function initBgDots() {
  bgDots = [];
  for (let i = 0; i < 22; i++) {
    bgDots.push({
      x: rand(0, W),
      y: rand(0, H),
      r: rand(14, 46),
      col: Math.random() < 0.5 ? 'rgba(255,230,200,0.45)' : 'rgba(255,205,225,0.4)'
    });
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#FFF6E4');
  g.addColorStop(0.55, '#FFE8D5');
  g.addColorStop(1,    '#FFD9E2');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  for (const d of bgDots) {
    ctx.fillStyle = d.col;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fill();
  }
}

function drawTable() {
  const y = BASE_Y + LAYER_H + camY;

  // بشقاب
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(W / 2, y + 14, 140, 22, 0, 0, TAU);
  ctx.fill();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(W / 2, y + 10, 132, 18, 0, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(200,160,140,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(W / 2, y + 10, 132, 18, 0, 0, TAU);
  ctx.stroke();

  // سایه زیر بشقاب
  ctx.fillStyle = 'rgba(120,60,80,0.10)';
  ctx.beginPath();
  ctx.ellipse(W / 2, y + 26, 118, 10, 0, 0, TAU);
  ctx.fill();
}

/* ══════════════════════════════════════════
   ۱۰) رسم لایه‌ها
   ══════════════════════════════════════════ */
function drawLayerBody(x, y, w, h, c, isTop, alpha) {
  if (alpha != null) ctx.globalAlpha = alpha;

  // سایه
  ctx.fillStyle = 'rgba(120,60,80,0.10)';
  ctx.beginPath();
  ctx.roundRect(x + 2, y + 3, w, h, 5);
  ctx.fill();

  // بدنه با گرادیان
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0,    c.top);
  g.addColorStop(0.4,  c.body);
  g.addColorStop(1,    c.bot);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 5);
  ctx.fill();

  // خط جداکننده‌ی تیره در پایین
  ctx.fillStyle = 'rgba(120,60,40,0.16)';
  ctx.beginPath();
  ctx.roundRect(x + 3, y + h - 3, w - 6, 2.5, 2);
  ctx.fill();

  // هایلایت بالای لایه (فقط برای بالاترین)
  if (isTop) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.roundRect(x + 5, y + 2.5, w - 10, 3, 2);
    ctx.fill();
  }

  // دورخط نازک
  ctx.strokeStyle = 'rgba(120,60,40,0.20)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 5);
  ctx.stroke();

  if (alpha != null) ctx.globalAlpha = 1;
}

function drawCherry(cx, cy) {
  // ساقه
  ctx.strokeStyle = '#5A8A3A';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 2);
  ctx.quadraticCurveTo(cx + 3, cy - 7, cx + 7, cy - 10);
  ctx.stroke();

  // بدنه
  const g = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 9);
  g.addColorStop(0, '#FF6B7A');
  g.addColorStop(1, '#BE1030');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, TAU);
  ctx.fill();

  // براقی
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.arc(cx - 3, cy - 3, 2.4, 0, TAU);
  ctx.fill();
}

function drawStack() {
  for (let i = 0; i < stack.length; i++) {
    const L = stack[i];
    const c = COLORS[L.colorIdx];
    const isTop = (i === stack.length - 1) && !current;
    drawLayerBody(L.x, L.y + camY, L.w, LAYER_H, c, isTop);
  }
}

function drawCurrent() {
  if (!current) return;
  const c = COLORS[current.colorIdx];
  const x = current.x;
  const y = current.y + camY;
  const w = current.w;

  // سایه‌ی نرم زیرش
  ctx.save();
  ctx.shadowColor = 'rgba(80,30,60,0.28)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = c.body;
  ctx.beginPath();
  ctx.roundRect(x, y, w, LAYER_H, 5);
  ctx.fill();
  ctx.restore();

  // بدنه با گرادیان
  const g = ctx.createLinearGradient(0, y, 0, y + LAYER_H);
  g.addColorStop(0,   c.top);
  g.addColorStop(0.4, c.body);
  g.addColorStop(1,   c.bot);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(x, y, w, LAYER_H, 5);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.roundRect(x + 5, y + 2.5, w - 10, 3, 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(120,60,40,0.28)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(x + 0.5, y + 0.5, w - 1, LAYER_H - 1, 5);
  ctx.stroke();

  // گیلاس روی سرش
  drawCherry(x + w / 2, y - 5);
}

function drawDying() {
  if (!dyingLayer) return;
  const L = dyingLayer;
  const c = COLORS[L.colorIdx];

  ctx.save();
  ctx.translate(L.x + L.w / 2, L.y + camY + LAYER_H / 2);
  ctx.rotate(L.rot);
  ctx.globalAlpha = Math.max(0, 1 - dyingT / 90);
  drawLayerBody(-L.w / 2, -LAYER_H / 2, L.w, LAYER_H, c, false, 1);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════
   ۱۱) به‌روزرسانی
   ══════════════════════════════════════════ */
function update() {
  frame++;
  updateParticles();
  updateFloats();
  if (shake > 0) { shake *= 0.88; if (shake < 0.3) shake = 0; }

  /* ── صفحه‌ی آماده ── */
  if (state === READY) {
    if (!current) spawnLayer();
    current.x += current.vx;
    if (current.x < 0)               { current.x = 0;             current.vx = Math.abs(current.vx); }
    if (current.x + current.w > W)   { current.x = W - current.w; current.vx = -Math.abs(current.vx); }
    return;
  }

  /* ── در حال بازی ── */
  if (state === PLAY) {
    if (current) {
      current.x += current.vx;
      if (current.x < 0)             { current.x = 0;             current.vx = Math.abs(current.vx); }
      if (current.x + current.w > W) { current.x = W - current.w; current.vx = -Math.abs(current.vx); }
    }

    // دوربین به سمت نوک برج
    const topY = stack[stack.length - 1].y;
    const targetCam = Math.max(0, CAM_TARGET - topY);
    camY += (targetCam - camY) * 0.14;
    return;
  }

  /* ── لحظه‌ی سقوط ── */
  if (state === DYING) {
    dyingT++;
    if (dyingLayer) {
      dyingLayer.vy += 0.9;
      dyingLayer.x  += dyingLayer.vx;
      dyingLayer.y  += dyingLayer.vy;
      dyingLayer.rot += dyingLayer.vr;
    }
    if (dyingT > 55) {
      state = OVER;
      $finalH.textContent = (stack.length - 1);
      $over.classList.remove('hidden');
      if (score > best) {
        best = score;
        localStorage.setItem('pancake_best', Math.floor(best));
        $best.textContent = pad(best, 4);
      }
    }
  }
}

/* ══════════════════════════════════════════
   ۱۲) رسم
   ══════════════════════════════════════════ */
function render() {
  ctx.save();
  if (shake > 0.4) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  drawBackground();
  drawTable();
  drawStack();
  drawCurrent();
  drawDying();
  drawParticles();
  drawFloats();

  ctx.restore();
}

/* ══════════════════════════════════════════
   ۱۳) حلقه‌ی گام ثابت
   ══════════════════════════════════════════ */
const STEP = 1000 / 60;
let acc = 0, last = performance.now();

function loop(now) {
  acc += Math.min(now - last, 200);
  last = now;
  let guard = 0;
  while (acc >= STEP && guard < 5) { update(); acc -= STEP; guard++; }
  if (guard >= 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════
   ۱۴) شروع / ریست
   ══════════════════════════════════════════ */
function startGame() {
  state = PLAY;
  score = 0; combo = 0; frame = 0;
  speed = SPEED_MIN;
  camY = 0; shake = 0; dyingT = 0;
  particles = []; floats = [];
  stack = [makeBaseLayer()];
  current = null;
  spawnDir = 1;

  $score.textContent = '0000';
  $start.classList.add('hidden');
  $over.classList.add('hidden');

  spawnLayer();
  audio();
}

/* ══════════════════════════════════════════
   ۱۵) ورودی
   ══════════════════════════════════════════ */
function press() {
  if (state === READY || state === OVER) { startGame(); return; }
  if (state === PLAY) drop();
}

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter' ||
      e.code === 'ArrowDown' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) press();
  }
});

$stage.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
$stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

$drop.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });

/* ══════════════════════════════════════════
   ۱۶) روشن!
   ══════════════════════════════════════════ */
initBgDots();
stack = [makeBaseLayer()];   // برای پیش‌نمایش در صفحه‌ی شروع
requestAnimationFrame(loop);

})();
</script>
</body>
