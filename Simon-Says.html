<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Simon Says</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Press Start 2P', cursive;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
  .btn3d { box-shadow: 0 4px 0 0 rgba(0,0,0,.22); }
  .btn3d:active { transform: translateY(2px); box-shadow: 0 2px 0 0 rgba(0,0,0,.22); }
  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .pulse { animation: pulse-soft 1.4s ease-in-out infinite; }
</style>
</head>
<body class="bg-gradient-to-b from-violet-100 via-fuchsia-100 to-pink-100 min-h-screen flex flex-col items-center justify-center p-2 md:p-4 text-slate-800">

<div class="w-full max-w-[460px] bg-white/80 backdrop-blur rounded-3xl p-3 shadow-2xl border-4 border-white flex flex-col items-center">

  <!-- ═══ هدر ═══ -->
  <div class="w-full flex justify-between items-center mb-2 px-1">
    <div class="flex items-center gap-1.5 text-fuchsia-700">
      <span class="text-base">🎨</span>
      <span class="text-[9px] font-bold tracking-wide">SIMON SAYS</span>
    </div>
    <div class="flex gap-2 bg-white/80 px-2 py-1 rounded-lg border border-fuchsia-200 text-[9px] text-fuchsia-700">
      <div>HI <span id="best" class="text-fuchsia-500">00</span></div>
      <div>★ <span id="score" class="text-pink-500">000</span></div>
    </div>
  </div>

  <!-- ═══ نوار وضعیت ═══ -->
  <div id="status" class="w-full text-center text-[9px] mb-2 h-4 text-fuchsia-600 pulse">
    برای شروع ضربه بزن
  </div>

  <!-- ═══ صحنه ═══ -->
  <div id="stage" class="relative w-full aspect-square rounded-2xl overflow-hidden border-2 border-fuchsia-200 bg-fuchsia-50">
    <canvas id="game" class="w-full h-full"></canvas>

    <!-- پایان -->
    <div id="overModal" class="hidden absolute inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center text-white p-4">
      <div class="text-3xl mb-2">💥</div>
      <h2 class="text-base text-fuchsia-300 mb-1 font-bold tracking-wider drop-shadow">GAME OVER</h2>
      <p class="text-[9px] text-fuchsia-100 mb-3">ترتیب اشتباه بود!</p>
      <div class="flex gap-4 text-[10px] text-white/85 mb-5">
        <div>مرحله: <span id="finalLvl" class="text-amber-300">0</span></div>
        <div>امتیاز: <span id="finalScore" class="text-amber-300">0</span></div>
      </div>
      <button id="restartBtn" class="btn3d bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold py-3 px-5 rounded-xl transition text-[9px]">
        دوباره (Space)
      </button>
    </div>
  </div>

  <!-- راهنمای کیبورد -->
  <div class="w-full mt-3 flex justify-center gap-2 text-[7px] text-fuchsia-400">
    <span class="bg-white/70 px-2 py-1 rounded border border-fuchsia-200">Q W A S</span>
    <span>یا</span>
    <span class="bg-white/70 px-2 py-1 rounded border border-fuchsia-200">۱ ۲ ۳ ۴</span>
    <span>روی کیبورد</span>
  </div>

  <div class="mt-2 text-[8px] text-fuchsia-400">HTML5 Canvas + Web Audio — صفر فایل خارجی</div>
</div>

<script>
(function () {
'use strict';

/* ══════════════════════════════════════════
   ۱) بوم
   ══════════════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = 480, H = 480;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.arcTo(x + w, y, x + w, y + h, tr);
    this.arcTo(x + w, y + h, x, y + h, br);
    this.arcTo(x, y + h, x, y, bl);
    this.arcTo(x, y, x + w, y, tl);
    this.closePath();
    return this;
  };
}

/* ══════════════════════════════════════════
   ۲) DOM
   ══════════════════════════════════════════ */
const $score      = document.getElementById('score');
const $best       = document.getElementById('best');
const $status     = document.getElementById('status');
const $over       = document.getElementById('overModal');
const $finalLvl   = document.getElementById('finalLvl');
const $finalScore = document.getElementById('finalScore');
const $stage      = document.getElementById('stage');
const $restart    = document.getElementById('restartBtn');

/* ══════════════════════════════════════════
   ۳) پدها — چهار گوشه با رنگ و نت مخصوص
   ══════════════════════════════════════════ */
const PAD_SIZE = 212;
const GAP = 12;
const OFFSET = (W - PAD_SIZE * 2 - GAP) / 2;   // = 22

const PADS = [
  { x: OFFSET,                       y: OFFSET,                       radii: [40, 10, 10, 10], hue: 335, note: 261.63, wave: 'sine' },
  { x: OFFSET + PAD_SIZE + GAP,      y: OFFSET,                       radii: [10, 40, 10, 10], hue: 40,  note: 329.63, wave: 'triangle' },
  { x: OFFSET,                       y: OFFSET + PAD_SIZE + GAP,      radii: [10, 10, 10, 40], hue: 170, note: 392.00, wave: 'sine' },
  { x: OFFSET + PAD_SIZE + GAP,      y: OFFSET + PAD_SIZE + GAP,      radii: [10, 10, 40, 10], hue: 265, note: 523.25, wave: 'triangle' }
];

// مرکز هر پد برای انفجار ذرات
const PAD_CENTERS = PADS.map(p => ({ x: p.x + p.w / 2, y: p.y + p.h / 2 }));
// پدها w/h ندارن، اضافه‌شون می‌کنیم
PADS.forEach(p => { p.w = PAD_SIZE; p.h = PAD_SIZE; });

/* ══════════════════════════════════════════
   ۴) ثابت‌ها و وضعیت
   ══════════════════════════════════════════ */
const TAU = Math.PI * 2;
const STEP = 1000 / 60;

const READY = 0, SHOWING = 1, LISTENING = 2, ROUND_END = 3, ERROR = 4, OVER = 5;

let state = READY;
let sequence = [];        // آرایه‌ی شماره‌ی پدها
let playerIndex = 0;      // چند تا رو درست زده
let level = 0;
let score = 0;
let best = Number(localStorage.getItem('simon_best')) || 0;

// نور پدها
const litTarget = [0, 0, 0, 0];
const litSmooth = [0, 0, 0, 0];
const releaseTimers = [0, 0, 0, 0];

// زمان‌بندی نمایش
let showClock = 0;
let showSchedule = [];
let showDoneT = 0;

// حالت‌های موقت
let stateTimer = 0;
let shake = 0;
let errorFlash = 0;
let frame = 0;
let combo = 0;

let particles = [];
let floats = [];

$best.textContent = String(best).padStart(2, '0');

/* ══════════════════════════════════════════
   ۵) ابزار
   ══════════════════════════════════════════ */
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pad(n, l) { return String(Math.floor(n)).padStart(l, '0'); }

/* ══════════════════════════════════════════
   ۶) صدا — Web Audio بدون فایل
   ══════════════════════════════════════════ */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}

function playNote(i, dur) {
  const a = audio(); if (!a) return;
  const p = PADS[i];
  const o = a.createOscillator(), g = a.createGain();
  o.type = p.wave;
  o.frequency.setValueAtTime(p.note, a.currentTime);
  const d = dur || 0.4;
  // حمله‌ی نرم برای جلوگیری از کلیک
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.11, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  o.connect(g).connect(a.destination);
  o.start();
  o.stop(a.currentTime + d + 0.03);
}

function playError() {
  const a = audio(); if (!a) return;
  [330, 247, 165].forEach(function (f, i) {
    const t0 = a.currentTime + i * 0.09;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.6, t0 + 0.18);
    g.gain.setValueAtTime(0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + 0.24);
  });
}

function playLevelUp() {
  const a = audio(); if (!a) return;
  [523.25, 659.25, 783.99].forEach(function (f, i) {
    const t0 = a.currentTime + i * 0.07;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + 0.2);
  });
}

/* ══════════════════════════════════════════
   ۷) ذرات و متن‌های شناور
   ══════════════════════════════════════════ */
function burst(x, y, n, spMin, spMax, colors, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(spMin, spMax);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 0.8,
      life: 1,
      size: rand(2.5, 5.5),
      col: colors[(Math.random() * colors.length) | 0],
      grav: grav == null ? 0.06 : grav
    });
  }
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.98;
    p.life -= 0.032;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.size * p.life), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function addFloat(x, y, text, color, size) {
  floats.push({ x, y, text, color, size: size || 13, life: 1, vy: -1.0 });
}
function updateFloats() {
  for (const f of floats) { f.y += f.vy; f.vy *= 0.96; f.life -= 0.016; }
  floats = floats.filter(f => f.life > 0);
}
function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life * 1.4, 0, 1);
    ctx.font = 'bold ' + f.size + "px 'Press Start 2P', monospace";
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════
   ۸) منطق بازی
   ══════════════════════════════════════════ */
function setStatus(text, cls) {
  $status.textContent = text;
  $status.className = 'w-full text-center text-[9px] mb-2 h-4 ' + (cls || 'text-fuchsia-600');
}

function startGame() {
  state = READY;
  sequence = [];
  playerIndex = 0;
  level = 0;
  score = 0;
  combo = 0;
  particles = [];
  floats = [];
  shake = 0;
  errorFlash = 0;
  litTarget.fill(0);
  litSmooth.fill(0);
  releaseTimers.fill(0);

  $score.textContent = '000';
  $over.classList.add('hidden');
  audio();

  nextRound();
}

function nextRound() {
  level++;
  playerIndex = 0;
  combo = 0;

  // یک نت جدید (بدون تکرار پشت‌سرهم)
  let next;
  do { next = (Math.random() * 4) | 0; }
  while (sequence.length > 0 && next === sequence[sequence.length - 1]);
  sequence.push(next);

  startShowing();
}

function startShowing() {
  showSchedule = [];
  const lit = Math.max(260, 480 - level * 14);
  const gap = Math.max(80, 160 - level * 4);
  let t = 260;

  for (const p of sequence) {
    showSchedule.push({ t: t,             pad: p, on: true  });
    showSchedule.push({ t: t + lit,       pad: p, on: false });
    t += lit + gap;
  }
  showDoneT = t + 120;
  showClock = 0;
  state = SHOWING;

  setStatus('تماشا کن... (مرحله ' + level + ')', 'text-amber-600 pulse');
}

function tryPad(i) {
  if (state !== LISTENING) return;
  if (releaseTimers[i] > 0) return;   // دِبونس

  litTarget[i] = 1;
  releaseTimers[i] = 220;
  playNote(i, 0.3);
  burst(PAD_CENTERS[i].x, PAD_CENTERS[i].y, 8, 1, 3.4,
        ['hsl(' + PADS[i].hue + ',100%,85%)', '#FFFFFF', 'hsl(' + PADS[i].hue + ',100%,65%)'], 0.10);
  shake = 2.5;

  if (sequence[playerIndex] === i) {
    // ✔ درست
    playerIndex++;
    score += 1 + combo;
    combo++;
    $score.textContent = pad(score, 3);

    if (playerIndex >= sequence.length) {
      // مرحله تموم
      state = ROUND_END;
      stateTimer = 640;
      playLevelUp();
      setStatus('آفرین! ✓', 'text-emerald-600');
      addFloat(W / 2, 240, 'NICE!', '#10B981', 14);
    }
  } else {
    // ✘ اشتباه
    onError();
  }
}

function onError() {
  state = ERROR;
  stateTimer = 0;
  shake = 18;
  errorFlash = 1;
  playError();
  setStatus('اشتباه! ✗', 'text-rose-600');
  addFloat(W / 2, 240, 'WRONG', '#E11D48', 16);

  // همه‌ی پدها قرمز بشن
  for (let i = 0; i < 4; i++) litTarget[i] = 1;
}

function finishGame() {
  state = OVER;
  $finalLvl.textContent = String(level);
  $finalScore.textContent = String(score);
  $over.classList.remove('hidden');

  if (level > best) {
    best = level;
    localStorage.setItem('simon_best', String(best));
    $best.textContent = pad(best, 2);
  }
}

/* ══════════════════════════════════════════
   ۹) به‌روزرسانی
   ══════════════════════════════════════════ */
function update() {
  frame++;

  // ── نرم‌سازی نور پدها ──
  for (let i = 0; i < 4; i++) {
    if (releaseTimers[i] > 0) {
      releaseTimers[i] -= STEP;
      if (releaseTimers[i] <= 0) litTarget[i] = 0;
    }
    if (litTarget[i] > litSmooth[i]) litSmooth[i] += (litTarget[i] - litSmooth[i]) * 0.38;   // حمله‌ی تند
    else                              litSmooth[i] += (litTarget[i] - litSmooth[i]) * 0.16;   // رهش نرم
  }

  updateParticles();
  updateFloats();
  if (shake > 0) { shake *= 0.86; if (shake < 0.3) shake = 0; }
  if (errorFlash > 0) { errorFlash -= 0.035; if (errorFlash < 0) errorFlash = 0; }

  // ── آماده ──
  if (state === READY) return;

  // ── نمایش توالی ──
  if (state === SHOWING) {
    showClock += STEP;
    while (showSchedule.length > 0 && showSchedule[0].t <= showClock) {
      const ev = showSchedule.shift();
      if (ev.on) {
        litTarget[ev.pad] = 1;
        playNote(ev.pad, 0.36);
        burst(PAD_CENTERS[ev.pad].x, PAD_CENTERS[ev.pad].y, 6, 0.6, 2.2,
              ['hsl(' + PADS[ev.pad].hue + ',100%,88%)', '#FFFFFF'], 0.05);
      } else {
        litTarget[ev.pad] = 0;
      }
    }
    if (showClock >= showDoneT) {
      state = LISTENING;
      playerIndex = 0;
      setStatus('نوبت توئه! (' + sequence.length + ' نت)', 'text-fuchsia-600 pulse');
    }
    return;
  }

  // ── انتهای مرحله ──
  if (state === ROUND_END) {
    stateTimer -= STEP;
    if (stateTimer <= 0) nextRound();
    return;
  }

  // ── لحظه‌ی خطا ──
  if (state === ERROR) {
    stateTimer += STEP;
    if (stateTimer > 780) finishGame();
    return;
  }
}

/* ══════════════════════════════════════════
   ۱۰) رسم
   ══════════════════════════════════════════ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0,    '#FDF6FF');
  g.addColorStop(0.5,  '#FCE9F5');
  g.addColorStop(1,    '#F0ECFF');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawPad(i) {
  const p = PADS[i];
  const light = litSmooth[i];
  const hue = p.hue;

  ctx.save();
  ctx.beginPath();
  ctx.roundRect(p.x, p.y, p.w, p.h, p.radii);

  // پایه (تیره، پاستلی)
  const baseG = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
  baseG.addColorStop(0, 'hsl(' + hue + ',45%,82%)');
  baseG.addColorStop(1, 'hsl(' + hue + ',42%,72%)');
  ctx.fillStyle = baseG;
  ctx.fill();

  // سایه‌ی داخلی پایین
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(80,30,60,0.08)';
  ctx.beginPath();
  ctx.roundRect(p.x + 6, p.y + p.h - 14, p.w - 12, 12, 6);
  ctx.fill();
  ctx.restore();

  // هایلایت بالای پد
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.roundRect(p.x + 10, p.y + 8, p.w - 20, 6, 3);
  ctx.fill();
  ctx.restore();

  // ── لایه‌ی نور (وقتی روشنه) ──
  if (light > 0.01) {
    ctx.save();
    ctx.clip();

    // گرادیان شعاعی از مرکز
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(p.w, p.h) * 0.8);
    rg.addColorStop(0,    'hsla(' + hue + ',100%,88%,' + (light * 0.95) + ')');
    rg.addColorStop(0.45, 'hsla(' + hue + ',100%,68%,' + (light * 0.85) + ')');
    rg.addColorStop(1,    'hsla(' + hue + ',100%,60%,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.restore();

    // هاله‌ی بیرونی
    ctx.save();
    ctx.shadowColor = 'hsl(' + hue + ',100%,70%)';
    ctx.shadowBlur = 42 * light;
    ctx.fillStyle = 'hsla(' + hue + ',100%,70%,' + (light * 0.35) + ')';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, p.radii);
    ctx.fill();
    ctx.restore();
  }

  // دورخط
  ctx.strokeStyle = 'rgba(90,40,80,0.14)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2, p.radii);
  ctx.stroke();

  ctx.restore();
}

function drawCenter() {
  const cx = W / 2, cy = H / 2;
  const R = 54;

  // سایه زیر دایره
  ctx.fillStyle = 'rgba(60,20,50,0.15)';
  ctx.beginPath();
  ctx.arc(cx, cy + 4, R, 0, TAU);
  ctx.fill();

  // بدنه‌ی دایره
  const g = ctx.createRadialGradient(cx - 12, cy - 14, 4, cx, cy, R * 1.3);
  g.addColorStop(0, '#FFFFFF');
  g.addColorStop(1, '#F4EAF6');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fill();

  // حلقه‌ی داخلی
  ctx.strokeStyle = 'rgba(160,90,150,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();

  // ── آرک پیشرفت (فقط در حالت LISTENING) ──
  if (state === LISTENING && sequence.length > 0) {
    const prog = playerIndex / sequence.length;
    ctx.strokeStyle = '#D946A8';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, R + 10, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
    ctx.stroke();

    // نشانگر انتها
    if (prog > 0.02) {
      const a = -Math.PI / 2 + TAU * prog;
      ctx.fillStyle = '#D946A8';
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * (R + 10), cy + Math.sin(a) * (R + 10), 4, 0, TAU);
      ctx.fill();
    }
  }

  // ── متن مرکز ──
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let big = '', small = '';
  if (state === READY)          { big = 'GO';  small = 'TAP';  }
  else if (state === SHOWING)   { big = String(level); small = '👁'; }
  else if (state === LISTENING) { big = String(level); small = '▶'; }
  else if (state === ROUND_END) { big = '✓';   small = '';     }
  else if (state === ERROR)     { big = '✗';   small = '';     }
  else if (state === OVER)      { big = '↻';   small = 'END';  }

  if (small) {
    ctx.font = "9px 'Press Start 2P', monospace";
    ctx.fillStyle = 'rgba(160,90,150,0.85)';
    ctx.fillText(small, cx, cy - 14);
  }

  // رنگ متن بسته به حالت
  let col = '#A03090';
  if (state === ROUND_END) col = '#10B981';
  if (state === ERROR)     col = '#E11D48';

  ctx.font = "bold 20px 'Press Start 2P', monospace";
  ctx.lineWidth = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.strokeText(big, cx, cy + (small ? 8 : 2));
  ctx.fillStyle = col;
  ctx.fillText(big, cx, cy + (small ? 8 : 2));
}

function render() {
  ctx.save();
  if (shake > 0.4) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  drawBackground();

  for (let i = 0; i < 4; i++) drawPad(i);

  drawCenter();

  // فلاش قرمز روی همه‌چیز
  if (errorFlash > 0) {
    ctx.fillStyle = 'rgba(225,29,72,' + (errorFlash * 0.28) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawParticles();
  drawFloats();

  ctx.restore();
}

/* ══════════════════════════════════════════
   ۱۱) حلقه‌ی گام ثابت
   ══════════════════════════════════════════ */
let acc = 0, last = performance.now();

function loop(now) {
  acc += Math.min(now - last, 200);
  last = now;
  let guard = 0;
  while (acc >= STEP && guard < 5) { update(); acc -= STEP; guard++; }
  if (guard >= 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════
   ۱۲) ورودی
   ══════════════════════════════════════════ */
function pressAt(x, y) {
  if (state === READY || state === OVER) { startGame(); return; }
  for (let i = 0; i < 4; i++) {
    const p = PADS[i];
    if (x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h) {
      tryPad(i);
      return;
    }
  }
}

// اشاره‌گر
$stage.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width  * W;
  const y = (e.clientY - rect.top)  / rect.height * H;
  pressAt(x, y);
});
$stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

$restart.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  e.stopPropagation();
  startGame();
});

// کیبورد
const KEYMAP = {
  'KeyQ': 0, 'Digit1': 0, 'Numpad1': 0,
  'KeyW': 1, 'Digit2': 1, 'Numpad2': 1,
  'KeyA': 2, 'Digit3': 2, 'Numpad3': 2,
  'KeyS': 3, 'Digit4': 3, 'Numpad4': 3
};

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat && (state === READY || state === OVER)) startGame();
    return;
  }
  const i = KEYMAP[e.code];
  if (i != null) {
    e.preventDefault();
    if (state === READY || state === OVER) startGame();
    else tryPad(i);
  }
});

/* ══════════════════════════════════════════
   ۱۳) روشن!
   ══════════════════════════════════════════ */
setStatus('برای شروع ضربه بزن', 'text-fuchsia-600 pulse');
requestAnimationFrame(loop);

})();
</script>
</body>
