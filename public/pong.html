<script>
(function () {
'use strict';

/* ══════════════════════════════════════════
   ۱) بوم — با منطق adaptive resolution
   ══════════════════════════════════════════ */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

const W = 480;
const H = 720;   // نسبت 2:3 — مناسب موبایل portrait

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 2 || rect.height < 2) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pw = Math.round(rect.width  * dpr);
  const ph = Math.round(rect.height * dpr);

  if (canvas.width !== pw || canvas.height !== ph) {
    canvas.width  = pw;
    canvas.height = ph;
  }
  const sx = (rect.width  / W) * dpr;
  const sy = (rect.height / H) * dpr;
  ctx.setTransform(sx, 0, 0, sy, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', function () { setTimeout(resizeCanvas, 250); });
if (window.ResizeObserver) { new ResizeObserver(resizeCanvas).observe(canvas); }

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.arcTo(x + w, y, x + w, y + h, tr);
    this.arcTo(x + w, y + h, x, y + h, br);
    this.arcTo(x, y + h, x, y, bl);
    this.arcTo(x, y, x + w, y, tl);
    this.closePath();
    return this;
  };
}

/* ══════════════════════════════════════════
   ۲) DOM
   ══════════════════════════════════════════ */
const $start     = document.getElementById('startModal');
const $win       = document.getElementById('winModal');
const $winText   = document.getElementById('winText');
const $winSub    = document.getElementById('winSub');
const $winScore  = document.getElementById('winScore');
const $winEmoji  = document.getElementById('winEmoji');
const $playAgain = document.getElementById('playAgainBtn');
const $menuBtn   = document.getElementById('menuBtn');
const $pause     = document.getElementById('pauseModal');
const $resume    = document.getElementById('resumeBtn');
const $backBtn   = document.getElementById('backBtn');
const $backBtn2  = document.getElementById('backBtn2');
const $pauseBtn  = document.getElementById('pauseBtn');
const $muteBtn   = document.getElementById('muteBtn');
const $stage     = document.getElementById('stage');
const $modePill  = document.getElementById('modePill');

/* ══════════════════════════════════════════
   ۳) ثابت‌ها
   ══════════════════════════════════════════ */
const TAU = Math.PI * 2;
const STEP = 1000 / 60;

// چیدمان
const PADDLE_W = 90;
const PADDLE_H = 12;
const PADDLE_MARGIN = 60;
const P2_Y = PADDLE_MARGIN;                 // 60
const P1_Y = H - PADDLE_MARGIN - PADDLE_H;  // 648
const BALL_R = 8;

// فیزیک
const HUMAN_SPEED   = 9;      // px/frame @ 60fps
const BALL_SPEED_START = 5;
const BALL_SPEED_MAX   = 11;
const BALL_SPEED_INC   = 0.20;
const MAX_BOUNCE_ANGLE = Math.PI / 3;   // 60°
const MIN_VY_FRAC      = 0.35;          // حداقل مؤلفه‌ی عمودی بعد از برخورد

// بازی
const WIN_SCORE = 7;
const SERVE_FRAMES = 75;   // ~1.25s

// رنگ‌ها
const C_P1 = '#3EE6A0';
const C_P2 = '#FF4D8F';
const C_BALL = '#FFFFFF';

// AI
const AI_PARAMS = {
  easy:   { speed: 5.5, reaction: 18, error: 78, jitter: 0.55 },
  medium: { speed: 7.2, reaction: 10, error: 38, jitter: 0.30 },
  hard:   { speed: 9.3, reaction: 4,  error: 14, jitter: 0.12 }
};

/* ══════════════════════════════════════════
   ۴) وضعیت
   ══════════════════════════════════════════ */
const MENU = 0, SERVE = 1, PLAY = 2, MATCH_END = 3;
let state = MENU;

let mode = '1P';
let difficulty = 'medium';

let score1 = 0, score2 = 0;
let scoreFlash1 = 0, scoreFlash2 = 0;
let serveTimer = 0;
let serveDir = 1;   // +1 → به سمت P1 (پایین)
let winner = 0;
let matchEndTimer = 0;

let paused = false;
let muted = false;

let frame = 0;
let shake = 0;

// ذرات
let particles = [];

// پدال‌ها
const paddle1 = { x: W/2, y: P1_Y, w: PADDLE_W, h: PADDLE_H, vx: 0, glow: 0 };
const paddle2 = { x: W/2, y: P2_Y, w: PADDLE_W, h: PADDLE_H, vx: 0, glow: 0 };

// توپ
const ball = {
  x: W/2, y: H/2,
  prevX: W/2, prevY: H/2,
  vx: 0, vy: 0,
  r: BALL_R,
  speed: BALL_SPEED_START,
  trail: []
};

// AI
const ai = { targetX: W/2, frameCount: 0 };

// ورودی
const keys = { a: false, d: false, left: false, right: false };

let p1Touch = null, p2Touch = null;   // { id, x }
const touches = new Map();

/* ══════════════════════════════════════════
   ۵) ابزار
   ══════════════════════════════════════════ */
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function foldX(x) {
  const period = 2 * W;
  let m = x % period;
  if (m < 0) m += period;
  return W - Math.abs(m - W);
}

/* ══════════════════════════════════════════
   ۶) صدا
   ══════════════════════════════════════════ */
let actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
  return actx;
}

function tone(freq, dur, type, vol, slideTo) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, a.currentTime + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start();
  o.stop(a.currentTime + dur + 0.02);
}

function sfxPaddleHit(freq, isTop) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = isTop ? 'square' : 'triangle';
  o.frequency.setValueAtTime(freq, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.72, a.currentTime + 0.09);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.09, a.currentTime + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.13);
  o.connect(g).connect(a.destination);
  o.start();
  o.stop(a.currentTime + 0.15);
}

function sfxWall() { tone(240, 0.04, 'square', 0.04, 180); }

function sfxScore() {
  if (muted) return;
  tone(392, 0.12, 'sine', 0.09, 370);
  setTimeout(function () { tone(196, 0.32, 'sine', 0.09, 160); }, 110);
}

function sfxServe() { tone(660, 0.05, 'triangle', 0.05, 900); }

function sfxWin() {
  if (muted) return;
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach(function (f, i) {
    setTimeout(function () { tone(f, 0.16, 'square', 0.06); }, i * 100);
  });
}

/* ══════════════════════════════════════════
   ۷) ذرات
   ══════════════════════════════════════════ */
function burst(x, y, n, spread, spMax, colors, grav) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(0.5, spMax);
    particles.push({
      x: x + rand(-spread, spread),
      y: y + rand(-spread, spread),
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      size: rand(2, 5),
      col: colors[(Math.random() * colors.length) | 0],
      grav: grav == null ? 0.06 : grav
    });
  }
}

function updateParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav;
    p.vx *= 0.97;
    p.life -= 0.030;
  }
  particles = particles.filter(function (p) { return p.life > 0; });
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.size * p.life), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════
   ۸) پس‌زمینه (یک بار ساخته می‌شه)
   ══════════════════════════════════════════ */
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W;
bgCanvas.height = H;
(function buildBg() {
  const bg = bgCanvas.getContext('2d');

  // گرادیان پایه
  const g = bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#08182A');
  g.addColorStop(0.5, '#060F1C');
  g.addColorStop(1,   '#030810');
  bg.fillStyle = g;
  bg.fillRect(0, 0, W, H);

  // شبکه‌ی ظریف
  bg.strokeStyle = 'rgba(110,200,255,0.028)';
  bg.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) {
    bg.beginPath();
    bg.moveTo(x + 0.5, 0);
    bg.lineTo(x + 0.5, H);
    bg.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    bg.beginPath();
    bg.moveTo(0, y + 0.5);
    bg.lineTo(W, y + 0.5);
    bg.stroke();
  }

  // اسکن‌لاین‌ها (CRT feel)
  for (let y = 0; y < H; y += 3) {
    bg.fillStyle = 'rgba(0,0,0,0.10)';
    bg.fillRect(0, y, W, 1);
  }

  // وینیت
  const vg = bg.createRadialGradient(W/2, H/2, H * 0.30, W/2, H/2, H * 0.80);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  bg.fillStyle = vg;
  bg.fillRect(0, 0, W, H);
})();

/* ══════════════════════════════════════════
   ۹) منطق AI
   ══════════════════════════════════════════ */
function predictLandingX(targetY, b) {
  // پیش‌بینی محل برخورد توپ با خط افقی targetY با احتساب بازتاب از دیوارها
  if (b.vy >= -0.01) return b.x;
  const t = (targetY - b.y) / b.vy;
  if (t <= 0) return b.x;
  return foldX(b.x + b.vx * t);
}

function updateAIPaddle() {
  const params = AI_PARAMS[difficulty];
  const prevX = paddle2.x;

  ai.frameCount++;
  if (ai.frameCount >= params.reaction) {
    ai.frameCount = 0;

    if (ball.vy < 0 && ball.y > P2_Y + PADDLE_H + 20) {
      // توپ داره به سمت بالا (طرف P2) میاد → پیش‌بینی کن
      const targetY = P2_Y + PADDLE_H + ball.r;
      const landing = predictLandingX(targetY, ball);
      ai.targetX = landing + (Math.random() * 2 - 1) * params.error;
    } else if (ball.vy > 0) {
      // توپ داره دور می‌شه → برگرد به مرکز با یه نوسان ملایم
      ai.targetX = W/2 + Math.sin(frame * 0.014) * 45;
    }
  }

  ai.targetX = clamp(ai.targetX, PADDLE_W/2, W - PADDLE_W/2);

  const diff = ai.targetX - paddle2.x;
  let dx;
  if (Math.abs(diff) < params.speed) dx = diff;
  else dx = Math.sign(diff) * params.speed;

  // یه لرزش خیلی کوچیک وقتی نزدیک هدفه، تا زنده به نظر بیاد
  if (Math.abs(diff) < 8) {
    dx += (Math.random() * 2 - 1) * params.jitter;
  }

  paddle2.x += dx;
  paddle2.x = clamp(paddle2.x, PADDLE_W/2, W - PADDLE_W/2);
  paddle2.vx = paddle2.x - prevX;
}

/* ══════════════════════════════════════════
   ۱۰) حرکت پدال‌ها (ورودی انسان)
   ══════════════════════════════════════════ */
function updatePaddle1() {
  const prevX = paddle1.x;

  if (p1Touch) {
    // لمسی: پدال مرکز به انگشت می‌چسبه با نرم‌سازی
    const target = clamp(p1Touch.x, PADDLE_W/2, W - PADDLE_W/2);
    paddle1.x += (target - paddle1.x) * 0.42;
  } else {
    let dx = 0;
    if (keys.a || (mode === '1P' && keys.left))  dx -= HUMAN_SPEED;
    if (keys.d || (mode === '1P' && keys.right)) dx += HUMAN_SPEED;
    paddle1.x += dx;
  }

  paddle1.x = clamp(paddle1.x, PADDLE_W/2, W - PADDLE_W/2);
  paddle1.vx = paddle1.x - prevX;
}

function updatePaddle2() {
  if (mode === '2P') {
    const prevX = paddle2.x;

    if (p2Touch) {
      const target = clamp(p2Touch.x, PADDLE_W/2, W - PADDLE_W/2);
      paddle2.x += (target - paddle2.x) * 0.42;
    } else {
      let dx = 0;
      if (keys.left)  dx -= HUMAN_SPEED;
      if (keys.right) dx += HUMAN_SPEED;
      paddle2.x += dx;
    }

    paddle2.x = clamp(paddle2.x, PADDLE_W/2, W - PADDLE_W/2);
    paddle2.vx = paddle2.x - prevX;
  } else {
    updateAIPaddle();
  }
}

/* ══════════════════════════════════════════
   ۱۱) فیزیک توپ
   ══════════════════════════════════════════ */
function bounceOffPaddle(paddle, isTop) {
  // offset از مرکز پدال: -1 (چپ) تا +1 (راست)
  const offset = (ball.x - paddle.x) / (paddle.w / 2);
  const clampedOffset = clamp(offset, -1, 1);
  const angle = clampedOffset * MAX_BOUNCE_ANGLE;

  // افزایش سرعت
  ball.speed = Math.min(ball.speed + BALL_SPEED_INC, BALL_SPEED_MAX);

  // جهت: P2 (بالا) توپ به پایین می‌ره (+vy)، P1 برعکس
  const dirSign = isTop ? 1 : -1;
  let newVx = Math.sin(angle) * ball.speed;
  let newVy = dirSign * Math.cos(angle) * ball.speed;

  // اثر سرعت پدال روی زاویه
  newVx += paddle.vx * 0.35;

  // تضمین کن توپ واقعاً از پدال دور شه
  const minVy = ball.speed * MIN_VY_FRAC;
  if (isTop) {
    if (newVy < minVy) newVy = minVy;
  } else {
    if (newVy > -minVy) newVy = -minVy;
  }

  // نرمالایز برای حفظ سرعت دقیق
  const mag = Math.hypot(newVx, newVy) || 1;
  ball.vx = newVx / mag * ball.speed;
  ball.vy = newVy / mag * ball.speed;

  // بازخورد بصری
  paddle.glow = 1;
  shake = Math.min(10, 3 + ball.speed * 0.6);

  const hue = isTop ? 335 : 155;
  burst(ball.x, ball.y, 14, 2, 4.5,
        ['hsl(' + hue + ',100%,70%)', 'hsl(' + hue + ',100%,88%)', '#FFFFFF'], 0.07);

  const freq = 380 + Math.abs(clampedOffset) * 280;
  sfxPaddleHit(freq, isTop);
}

function checkPaddleCollision() {
  // پدال پایین (P1) — توپ داره پایین میاد
  if (ball.vy > 0) {
    const p = paddle1;
    if (ball.prevY + ball.r <= p.y && ball.y + ball.r > p.y) {
      // در چه لحظه‌ای از فریم، لبه‌ی پایین توپ به لبه‌ی بالای پدال رسید؟
      const t = (p.y - ball.r - ball.prevY) / (ball.y - ball.prevY);
      const crossX = ball.prevX + (ball.x - ball.prevX) * t;

      if (crossX + ball.r * 0.5 >= p.x - p.w/2 &&
          crossX - ball.r * 0.5 <= p.x + p.w/2) {
        ball.x = crossX;
        ball.y = p.y - ball.r;
        bounceOffPaddle(p, false);
      }
    }
  }

  // پدال بالا (P2) — توپ داره بالا میره
  if (ball.vy < 0) {
    const p = paddle2;
    if (ball.prevY - ball.r >= p.y + p.h && ball.y - ball.r < p.y + p.h) {
      const t = (p.y + p.h + ball.r - ball.prevY) / (ball.y - ball.prevY);
      const crossX = ball.prevX + (ball.x - ball.prevX) * t;

      if (crossX + ball.r * 0.5 >= p.x - p.w/2 &&
          crossX - ball.r * 0.5 <= p.x + p.w/2) {
        ball.x = crossX;
        ball.y = p.y + p.h + ball.r;
        bounceOffPaddle(p, true);
      }
    }
  }
}

function checkWallCollision() {
  if (ball.x - ball.r < 0) {
    ball.x = ball.r;
    ball.vx = Math.abs(ball.vx);
    sfxWall();
    burst(ball.x, ball.y, 6, 2, 2.5, ['#FFFFFF', '#AADDFF'], 0.03);
    shake = Math.max(shake, 3);
  } else if (ball.x + ball.r > W) {
    ball.x = W - ball.r;
    ball.vx = -Math.abs(ball.vx);
    sfxWall();
    burst(ball.x, ball.y, 6, 2, 2.5, ['#FFFFFF', '#AADDFF'], 0.03);
    shake = Math.max(shake, 3);
  }
}

function updateBall() {
  ball.prevX = ball.x;
  ball.prevY = ball.y;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // رد حرکت
  if (Math.abs(ball.vx) > 0.1 || Math.abs(ball.vy) > 0.1) {
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();
  }

  checkWallCollision();
  checkPaddleCollision();

  // گل؟
  if (ball.y - ball.r > H) {
    onScore(2);
  } else if (ball.y + ball.r < 0) {
    onScore(1);
  }
}

/* ══════════════════════════════════════════
   ۱۲) رویدادها
   ══════════════════════════════════════════ */
function launchBall() {
  const angle = (Math.random() * 2 - 1) * (Math.PI / 6);  // ±30°
  ball.vx = Math.sin(angle) * ball.speed;
  ball.vy = serveDir * Math.cos(angle) * ball.speed;
  ball.prevX = ball.x;
  ball.prevY = ball.y;
  ball.trail = [];
  sfxServe();
}

function resetBallForServe() {
  ball.x = W/2;
  ball.y = H/2;
  ball.prevX = W/2;
  ball.prevY = H/2;
  ball.vx = 0;
  ball.vy = 0;
  ball.speed = BALL_SPEED_START;
  ball.trail = [];
}

function onScore(scorer) {
  if (scorer === 1) { score1++; scoreFlash1 = 1; }
  else              { score2++; scoreFlash2 = 1; }

  shake = 16;
  sfxScore();

  // انفجار ذرات از نیمه‌ی بازنده
  const sideY = scorer === 1 ? 0 : H;
  const color = scorer === 1 ? C_P1 : C_P2;
  for (let i = 0; i < 26; i++) {
    burst(rand(0, W), sideY, 1, 3, 5,
          [color, '#FFFFFF', '#AADDFF'], 0.10);
  }

  // پایان مسابقه؟
  if (score1 >= WIN_SCORE || score2 >= WIN_SCORE) {
    winner = score1 >= WIN_SCORE ? 1 : 2;
    state = MATCH_END;
    matchEndTimer = 0;
    showWinModal();
    sfxWin();
    return;
  }

  // سرو بعدی
  serveDir = scorer === 1 ? 1 : -1;   // به سمت بازنده
  serveTimer = SERVE_FRAMES;
  resetBallForServe();
  state = SERVE;
}

/* ══════════════════════════════════════════
   ۱۳) به‌روزرسانی
   ══════════════════════════════════════════ */
function update() {
  if (paused) return;
  frame++;

  // fade
  paddle1.glow *= 0.88;
  paddle2.glow *= 0.88;
  if (shake > 0) { shake *= 0.87; if (shake < 0.3) shake = 0; }
  if (scoreFlash1 > 0) scoreFlash1 -= 0.020;
  if (scoreFlash2 > 0) scoreFlash2 -= 0.020;

  updateParticles();

  if (state === MENU) return;

  if (state === SERVE) {
    updatePaddle1();
    updatePaddle2();
    serveTimer--;
    if (serveTimer <= 0) {
      launchBall();
      state = PLAY;
    }
    return;
  }

  if (state === PLAY) {
    updatePaddle1();
    updatePaddle2();
    updateBall();
    return;
  }

  if (state === MATCH_END) {
    matchEndTimer++;
    // جشن
    if (matchEndTimer < 140 && frame % 3 === 0) {
      burst(rand(40, W - 40), rand(60, H - 60), 2, 4, 3,
            [C_P1, C_P2, '#FFD23F', '#FFFFFF'], 0.05);
    }
    return;
  }
}

/* ══════════════════════════════════════════
   ۱۴) رسم
   ══════════════════════════════════════════ */
function drawCenterLine() {
  ctx.strokeStyle = 'rgba(180,220,255,0.16)';
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 14]);
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  ctx.lineTo(W, H/2);
  ctx.stroke();
  ctx.setLineDash([]);

  // دایره‌ی وسط
  ctx.strokeStyle = 'rgba(180,220,255,0.10)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(W/2, H/2, 60, 0, TAU);
  ctx.stroke();
}

function drawPaddle(p, color, glowColor) {
  const x = p.x - p.w / 2;
  const y = p.y;
  const g = Math.max(0.35, p.glow);

  // لایه‌ی درخشان
  ctx.save();
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 12 + g * 30;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, p.w, p.h, p.h / 2);
  ctx.fill();
  ctx.restore();

  // تقویت درخشش بعد از ضربه
  if (p.glow > 0.3) {
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 30 + p.glow * 40;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, p.w, p.h, p.h / 2);
    ctx.fill();
    ctx.restore();
  }

  // هایلایت داخلی
  ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + p.glow * 0.6) + ')';
  ctx.beginPath();
  ctx.roundRect(x + 8, y + 2, p.w - 16, 2, 1);
  ctx.fill();
}

function drawBall() {
  // رد حرکت
  const n = ball.trail.length;
  for (let i = 0; i < n; i++) {
    const t = ball.trail[i];
    const frac = i / n;
    ctx.globalAlpha = frac * 0.42;
    ctx.fillStyle = C_BALL;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (0.25 + frac * 0.55), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // هاله
  const rg = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 3.2);
  rg.addColorStop(0, 'rgba(255,255,255,0.7)');
  rg.addColorStop(0.5, 'rgba(170,220,255,0.25)');
  rg.addColorStop(1, 'rgba(170,220,255,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 3.2, 0, TAU);
  ctx.fill();

  // بدنه‌ی توپ
  ctx.save();
  ctx.shadowColor = '#AADDFF';
  ctx.shadowBlur = 14;
  const bg = ctx.createRadialGradient(
    ball.x - ball.r * 0.3, ball.y - ball.r * 0.35, 1,
    ball.x, ball.y, ball.r * 1.1
  );
  bg.addColorStop(0, '#FFFFFF');
  bg.addColorStop(1, '#D7EBFF');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawServeIndicator() {
  const progress = 1 - serveTimer / SERVE_FRAMES;   // 0 → 1
  const receiver = serveDir > 0 ? C_P1 : C_P2;
  const pulse = 1 + Math.sin(frame * 0.28) * 0.18;

  // هاله‌ی رنگ بازیکن
  const rg = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 4);
  const rgb = serveDir > 0 ? '62,230,160' : '255,77,143';
  rg.addColorStop(0, 'rgba(' + rgb + ',0.6)');
  rg.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * 4, 0, TAU);
  ctx.fill();

  // توپ پالس‌دار
  ctx.fillStyle = C_BALL;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r * pulse, 0, TAU);
  ctx.fill();

  // حلقه‌ی کوچک‌شونده
  const ringR = ball.r + (1 - progress) * 46;
  ctx.strokeStyle = receiver;
  ctx.globalAlpha = (1 - progress) * 0.85;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ringR, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // فلش جهت
  const arrowY = ball.y + serveDir * 44;
  ctx.fillStyle = receiver;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  if (serveDir > 0) {
    ctx.moveTo(ball.x, arrowY + 12);
    ctx.lineTo(ball.x - 9, arrowY);
    ctx.lineTo(ball.x + 9, arrowY);
  } else {
    ctx.moveTo(ball.x, arrowY - 12);
    ctx.lineTo(ball.x - 9, arrowY);
    ctx.lineTo(ball.x + 9, arrowY);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawScores() {
  ctx.font = "bold 68px 'Press Start 2P', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // P2 score (بالا، زیر پدال P2)
  const a2 = 0.22 + scoreFlash2 * 0.7;
  const s2 = 1 + scoreFlash2 * 0.22;
  ctx.save();
  ctx.translate(W/2, 145);
  ctx.scale(s2, s2);
  ctx.fillStyle = 'rgba(255,77,143,' + a2 + ')';
  ctx.fillText(String(score2), 0, 0);
  ctx.restore();

  // P1 score (پایین، بالای پدال P1)
  const a1 = 0.22 + scoreFlash1 * 0.7;
  const s1 = 1 + scoreFlash1 * 0.22;
  ctx.save();
  ctx.translate(W/2, H - 145);
  ctx.scale(s1, s1);
  ctx.fillStyle = 'rgba(62,230,160,' + a1 + ')';
  ctx.fillText(String(score1), 0, 0);
  ctx.restore();
}

function render() {
  ctx.save();

  // لرزش
  if (shake > 0.5) {
    ctx.translate(
      (Math.random() * 2 - 1) * shake * 0.5,
      (Math.random() * 2 - 1) * shake * 0.5
    );
  }

  // پس‌زمینه
  ctx.drawImage(bgCanvas, 0, 0);

  // خط وسط
  drawCenterLine();

  // امتیازها
  drawScores();

  // پدال‌ها
  drawPaddle(paddle2, C_P2, '#FF4D8F');
  drawPaddle(paddle1, C_P1, '#3EE6A0');

  // توپ
  if (state === SERVE) {
    drawServeIndicator();
  } else if (state === PLAY) {
    drawBall();
  } else if (state === MATCH_END) {
    // توپ بی‌حرکت بمونه یا نشون ندیم — فعلاً نادیده
  }

  // ذرات
  drawParticles();

  ctx.restore();
}

/* ══════════════════════════════════════════
   ۱۵) حلقه‌ی اصلی
   ══════════════════════════════════════════ */
let acc = 0, lastT = performance.now();

function loop(now) {
  acc += Math.min(now - lastT, 200);
  lastT = now;
  let guard = 0;
  while (acc >= STEP && guard < 5) {
    update();
    acc -= STEP;
    guard++;
  }
  if (guard >= 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════
   ۱۶) شروع/ریست
   ══════════════════════════════════════════ */
function startMatch(m, d) {
  mode = m || mode;
  difficulty = d || difficulty;

  score1 = 0;
  score2 = 0;
  scoreFlash1 = 0;
  scoreFlash2 = 0;
  winner = 0;
  matchEndTimer = 0;
  frame = 0;
  shake = 0;
  particles = [];
  ball.trail = [];

  paddle1.x = W/2;
  paddle2.x = W/2;
  paddle1.vx = 0;
  paddle2.vx = 0;
  paddle1.glow = 0;
  paddle2.glow = 0;
  ai.targetX = W/2;
  ai.frameCount = 0;

  resetBallForServe();
  serveDir = Math.random() < 0.5 ? 1 : -1;
  serveTimer = SERVE_FRAMES;
  state = SERVE;

  paused = false;
  $start.classList.add('hidden');
  $win.classList.add('hidden');
  $win.classList.remove('flex');
  $pause.classList.add('hidden');
  $pause.classList.remove('flex');

  // پیل حالت
  if (mode === '2P') {
    $modePill.textContent = '2P';
    $modePill.className = 'px-font text-[7px] bg-pink-900/40 px-2 py-1 rounded border border-pink-700/60 text-pink-300';
  } else {
    const map = { easy: 'آسان', medium: 'متوسط', hard: 'سخت' };
    $modePill.textContent = 'AI · ' + map[difficulty];
    $modePill.className = 'px-font text-[7px] bg-emerald-900/40 px-2 py-1 rounded border border-emerald-700/60 text-emerald-300';
  }

  audio();
}

function showWinModal() {
  let title, sub, emoji;
  if (mode === '2P') {
    title = winner === 1 ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS';
    sub = winner === 1 ? 'نفر پایین برنده شد!' : 'نفر بالا برنده شد!';
    emoji = '🏆';
  } else {
    if (winner === 1) {
      title = 'YOU WIN';
      sub = 'کامپیوتر رو شکست دادی!';
      emoji = '🏆';
    } else {
      title = 'CPU WINS';
      sub = 'اینبار کامپیوتر برد';
      emoji = '💀';
    }
  }
  $winText.textContent = title;
  $winSub.textContent = sub;
  $winEmoji.textContent = emoji;
  $winScore.textContent = score1 + ' - ' + score2;
  $win.classList.remove('hidden');
  $win.classList.add('flex');
  if (window.ArcadeAPI && mode === '1P') {
  ArcadeAPI.saveScore('pong', score1, {
    meta: { won: winner === 1, difficulty: difficulty, opponentScore: score2 }
  });
}
}

function goToMenu() {
  state = MENU;
  paused = false;  
  $win.classList.add('hidden');
  $win.classList.remove('flex');
  $start.classList.remove('hidden');
  $pause.classList.add('hidden');
  $pause.classList.remove('flex');
}

function togglePause() {
  if (state !== PLAY && state !== SERVE) return;
  paused = !paused;
  if (paused) {
    $pause.classList.remove('hidden');
    $pause.classList.add('flex');
  } else {
    $pause.classList.add('hidden');
    $pause.classList.remove('flex');
  }
}

/* ══════════════════════════════════════════
   ۱۷) ورودی — کیبورد
   ══════════════════════════════════════════ */
const KEY_DIR = {
  'KeyA': 'a',
  'KeyD': 'd',
  'ArrowLeft': 'left',
  'ArrowRight': 'right'
};

window.addEventListener('keydown', function (e) {
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    togglePause();
    return;
  }
  if (e.code === 'KeyM') {
    e.preventDefault();
    toggleMute();
    return;
  }
  const k = KEY_DIR[e.code];
  if (k) {
    e.preventDefault();
    keys[k] = true;
  }
}, { passive: false });

window.addEventListener('keyup', function (e) {
  const k = KEY_DIR[e.code];
  if (k) {
    e.preventDefault();
    keys[k] = false;
  }
}, { passive: false });

/* ══════════════════════════════════════════
   ۱۸) ورودی — لمسی
   ══════════════════════════════════════════ */
function stageCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / rect.width  * W,
    y: (clientY - rect.top)  / rect.height * H
  };
}

function isUIButton(target) {
  return target && target.closest && (
    target.closest('button') ||
    target.closest('#startModal') ||
    target.closest('#winModal') ||
    target.closest('#pauseModal')
  );
}

function addTouch(id, clientX, clientY) {
  if (isUIButton(document.elementFromPoint(clientX, clientY))) return;

  const c = stageCoords(clientX, clientY);
  const which = c.y > H / 2 ? 'p1' : (mode === '2P' ? 'p2' : null);
  if (!which) return;
  touches.set(id, { which: which, x: c.x });
  syncTouches();
}

function moveTouch(id, clientX, clientY) {
  const t = touches.get(id);
  if (!t) return;
  const c = stageCoords(clientX, clientY);
  t.x = c.x;
  syncTouches();
}

function endTouch(id) {
  if (touches.has(id)) {
    touches.delete(id);
    syncTouches();
  }
}

function syncTouches() {
  p1Touch = null;
  p2Touch = null;
  for (const t of touches.values()) {
    if (t.which === 'p1') p1Touch = t;
    else if (t.which === 'p2') p2Touch = t;
  }
}

if (window.PointerEvent) {
  $stage.addEventListener('pointerdown', function (e) {
    if (isUIButton(e.target)) return;
    e.preventDefault();
    addTouch(e.pointerId, e.clientX, e.clientY);
  }, { passive: false });

  window.addEventListener('pointermove', function (e) {
    if (!touches.has(e.pointerId)) return;
    e.preventDefault();
    moveTouch(e.pointerId, e.clientX, e.clientY);
  }, { passive: false });

  window.addEventListener('pointerup', function (e) { endTouch(e.pointerId); });
  window.addEventListener('pointercancel', function (e) { endTouch(e.pointerId); });

} else {
  // فالبک تاچ قدیمی
  $stage.addEventListener('touchstart', function (e) {
    if (isUIButton(e.target)) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      addTouch(t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  $stage.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      moveTouch(t.identifier, t.clientX, t.clientY);
    }
  }, { passive: false });

  const endHandler = function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      endTouch(e.changedTouches[i].identifier);
    }
  };
  $stage.addEventListener('touchend', endHandler, { passive: true });
  $stage.addEventListener('touchcancel', endHandler, { passive: true });
}

// مسدودسازی رفتار پیش‌فرض لمسی روی صحنه (pull-to-refresh، زوم، ...)
$stage.addEventListener('touchmove', function (e) {
  if (e.cancelable) e.preventDefault();
}, { passive: false });

$stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ══════════════════════════════════════════
   ۱۹) دکمه‌ها
   ══════════════════════════════════════════ */
// منو — انتخاب حالت
$start.querySelectorAll('button[data-mode]').forEach(function (btn) {
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    const m = btn.dataset.mode;
    const d = btn.dataset.diff || difficulty;
    startMatch(m, d);
  });
});
// Back → منو
function handleBack(e) {
  e.preventDefault();
  e.stopPropagation();
  if (state === MENU) return;   // اگه تو منو هستیم کاری نکن
  goToMenu();
}
if ($backBtn)  $backBtn.addEventListener('click', handleBack);
if ($backBtn2) $backBtn2.addEventListener('click', handleBack);
// برد
$playAgain.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  startMatch(mode, difficulty);
});

$menuBtn.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  goToMenu();
});

// Pause
$resume.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  togglePause();
});
$pauseBtn.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  togglePause();
});

// Mute
function toggleMute() {
  muted = !muted;
  $muteBtn.textContent = muted ? '🔇' : '🔊';
  $muteBtn.classList.toggle('text-rose-400', muted);
  $muteBtn.classList.toggle('text-slate-300', !muted);
  if (!muted) sfxServe();
}
$muteBtn.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  toggleMute();
});

/* ══════════════════════════════════════════
   ۲۰) روشن!
   ══════════════════════════════════════════ */
resizeCanvas();
window.addEventListener('load', function () { setTimeout(resizeCanvas, 60); });
requestAnimationFrame(loop);

})();
</script>
