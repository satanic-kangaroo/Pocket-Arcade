<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06080F">
  <title>2048</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: 'Vazirmatn', 'Press Start 2P', system-ui, -apple-system, sans-serif;
      background: #06080F;
      color: #E2E8F0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    .px-font { font-family: 'Press Start 2P', 'Vazirmatn', monospace; }

    #stage {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      touch-action: none;
    }

    /* HUD */
    .hud-item {
      background: rgba(11,15,26,0.7);
      border: 1.5px solid rgba(100,116,139,0.35);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      font-family: 'Press Start 2P', monospace;
    }
    .hud-label {
      font-size: 0.55rem; color: #64748B;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .hud-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem; color: #00F0FF; letter-spacing: 0.02em;
    }
    .hud-value.yellow { color: #FFD700; }
    .hud-value.pink { color: #FF4D8F; }

    /* 3D Button */
    .btn3d { box-shadow: 0 4px 0 0 rgba(0,0,0,.35); transition: transform .1s; }
    .btn3d:active { transform: translateY(2px); box-shadow: 0 2px 0 0 rgba(0,0,0,.35); }

    /* Grid */
    .grid-wrapper {
      width: 356px; height: 356px;
      background: rgba(255,255,255,.03);
      border-radius: 12px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      position: relative;
    }

    .tile {
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', monospace;
      font-weight: 700;
      transition: transform .12s ease, background .15s;
      position: absolute;
    }

    /* Tile colors */
    .t-2    { background:#EEE4DA; color:#776E65; font-size:1.5rem; }
    .t-4    { background:#EDE0C8; color:#776E65; font-size:1.5rem; }
    .t-8    { background:#F2B179; color:#FFF;   font-size:1.5rem; }
    .t-16   { background:#F59563; color:#FFF;   font-size:1.5rem; }
    .t-32   { background:#F67C5F; color:#FFF;   font-size:1.4rem; }
    .t-64   { background:#F65E3B; color:#FFF;   font-size:1.4rem; }
    .t-128  { background:#EDCF72; color:#FFF;   font-size:1.3rem; box-shadow:0 0 20px rgba(237,207,114,.4); }
    .t-256  { background:#EDCC61; color:#FFF;   font-size:1.3rem; box-shadow:0 0 20px rgba(237,204,97,.4); }
    .t-512  { background:#EDC850; color:#FFF;   font-size:1.3rem; box-shadow:0 0 20px rgba(237,200,80,.4); }
    .t-1024 { background:#EDC53F; color:#FFF;   font-size:1.1rem; box-shadow:0 0 25px rgba(237,197,63,.5); }
    .t-2048 { background:#EDC22E; color:#FFF;   font-size:1.1rem; box-shadow:0 0 30px rgba(237,194,46,.6); }

    .tile-new { animation: tilePop .3s cubic-bezier(.22,1,.36,1); }
    .tile-merged { animation: tilePop .25s cubic-bezier(.22,1,.36,1); }

    @keyframes tilePop {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Modal */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(6,8,15,.85);
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #0B0F1A;
      border: 2px solid rgba(100,116,139,.5);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      min-width: 260px;
      max-width: 90vw;
    }
    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.2rem;
      color: #00F0FF;
      margin-bottom: 10px;
    }
    .modal-sub {
      font-size: .85rem;
      color: #94A3B8;
      margin-bottom: 16px;
    }
    .modal-btn {
      padding: 10px 22px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3EE6A0, #1E7A52);
      color: #FFF;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 0 #1E7A52;
      transition: all .12s;
    }
    .modal-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 0 #1E7A52; }

    .btn-new {
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(0,240,255,.12);
      border: 1px solid #00F0FF;
      color: #00F0FF;
      font-family: 'Press Start 2P', monospace;
      font-size: .55rem;
      cursor: pointer;
    }

    /* Particles */
    .fx-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: fxFloat .8s ease-out forwards;
    }
    @keyframes fxFloat {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-60px) scale(0); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 400px) {
      .grid-wrapper { width: 324px; height: 324px; gap: 6px; padding: 6px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <!-- Start Modal -->
  <div id="startModal" class="modal open">
    <div class="modal-box">
      <div class="modal-title">2048</div>
      <div class="modal-sub">با سوایپ یا فلش کیبورد حرکت بده.<br>کاشی‌های همرنگ ادغام شن.<br>رسید به 2048 یا باخت!</div>
      <button class="modal-btn" id="btnStart">شروع بازی</button>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="overModal" class="modal">
    <div class="modal-box">
      <div class="modal-title" style="color:#FF4D8F">باخت!</div>
      <div class="modal-sub" id="overSub">امتیاز: 0</div>
      <button class="modal-btn" id="btnRestart">بازی دوباره</button>
    </div>
  </div>

  <!-- Win Modal -->
  <div id="winModal" class="modal">
    <div class="modal-box">
      <div class="modal-title" style="color:#FFD700">برد! 🎉</div>
      <div class="modal-sub" id="winSub">رسیدی به 2048!</div>
      <button class="modal-btn" id="btnWinContinue">ادامه بازی</button>
      <button class="modal-btn" id="btnWinNew" style="background:linear-gradient(135deg,#FF4D8F,#B01A50);box-shadow:0 4px 0 0 #B01A50;margin-top:8px;">بازی جدید</button>
    </div>
  </div>

  <script src="./score.js"></script>
  <script>
  (function () {
    'use strict';

    /* ══════════════════════════════════════════
       ۲۰۴۸ — Game Logic
       ══════════════════════════════════════════ */

    const SIZE = 4;
    const WIN_VAL = 2048;
    const CELL_GAP = 8;
    const CELL_SIZE = 85;

    // ── State ──
    let grid = [];
    let score = 0;
    let best = 0;
    let state = 'READY'; // READY | PLAY | OVER | WIN
    let won = false;
    let keepPlaying = false;
    let moveCount = 0;
    let undoGrid = null;
    let undoScore = 0;

    // ── DOM refs ──
    const stage = document.getElementById('stage');
    const $start = document.getElementById('startModal');
    const $over  = document.getElementById('overModal');
    const $win   = document.getElementById('winModal');
    const $overSub = document.getElementById('overSub');
    const $winSub  = document.getElementById('winSub');

    // Build HUD
    const hud = document.createElement('div');
    hud.style.cssText = 'position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;align-items:center;flex-wrap:wrap;justify-content:center;';
    stage.appendChild(hud);

    function hudItem(label, cls) {
      const d = document.createElement('div');
      d.className = 'hud-item';
      d.innerHTML = '<div class="hud-label">' + label + '</div><div class="hud-value ' + (cls||'') + ' px-font">000000</div>';
      return d;
    }
    const $scoreHud = hudItem('SCORE');
    const $bestHud  = hudItem('BEST');
    hud.appendChild($scoreHud);
    hud.appendChild($bestHud);

    const $newBtn = document.createElement('button');
    $newBtn.className = 'btn-new';
    $newBtn.textContent = 'New';
    hud.appendChild($newBtn);

    // Board container
    const board = document.createElement('div');
    board.className = 'grid-wrapper';
    board.style.position = 'absolute';
    board.style.top = '50%'; board.style.left = '50%';
    board.style.transform = 'translate(-50%,-50%)';
    stage.appendChild(board);

    // ── Init ──
    function init() {
      grid = Array.from({length: SIZE}, function () { return Array(SIZE).fill(0); });
      score = 0;
      state = 'READY';
      won = false;
      keepPlaying = false;
      moveCount = 0;
      undoGrid = null;
      undoScore = 0;
      best = Number(localStorage.getItem('2048_best') || 0);
      updateHUD();
      addRandom(); addRandom();
      renderBoard();
      openModal($start);
    }

    // ── Tile spawn ──
    function addRandom() {
      const empty = [];
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] === 0) empty.push({r: r, c: c});
      if (!empty.length) return null;
      const pick = empty[Math.floor(Math.random() * empty.length)];
      grid[pick.r][pick.c] = Math.random() < 0.9 ? 2 : 4;
      return pick;
    }

    // ── Slide logic (returns {moved, mergedValue}) ──
    function slideRow(row) {
      const filtered = row.filter(function (v) { return v !== 0; });
      const result = [];
      let merged = 0;
      let i = 0;
      while (i < filtered.length) {
        if (i + 1 < filtered.length && filtered[i] === filtered[i+1]) {
          const val = filtered[i] * 2;
          result.push(val);
          merged += val;
          i += 2;
        } else {
          result.push(filtered[i]);
          i += 1;
        }
      }
      while (result.length < SIZE) result.push(0);
      const moved = JSON.stringify(result) !== JSON.stringify(row);
      return {arr: result, moved: moved, merged: merged};
    }

    // ── Moves ──
    function moveLeft() {
      let totalMoved = false, totalMerged = 0;
      const oldGrid = grid.map(function(r) { return r.slice(); });
      for (let r = 0; r < SIZE; r++) {
        const res = slideRow(grid[r]);
        grid[r] = res.arr;
        if (res.moved) totalMoved = true;
        totalMerged += res.merged;
      }
      return {moved: totalMoved, merged: totalMerged, oldGrid: oldGrid};
    }

    function moveRight() {
      for (let r = 0; r < SIZE; r++) grid[r].reverse();
      const res = moveLeft();
      for (let r = 0; r < SIZE; r++) grid[r].reverse();
      return res;
    }

    function moveUp() {
      transpose();
      const res = moveLeft();
      transpose();
      return res;
    }

    function moveDown() {
      transpose();
      const res = moveRight();
      transpose();
      return res;
    }

    function transpose() {
      for (let r = 0; r < SIZE; r++)
        for (let c = r + 1; c < SIZE; c++) {
          var tmp = grid[r][c];
          grid[r][c] = grid[c][r];
          grid[c][r] = tmp;
        }
    }

    // ── Game status ──
    function canMove() {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 0) return true;
          if (c + 1 < SIZE && grid[r][c] === grid[r][c+1]) return true;
          if (r + 1 < SIZE && grid[r][c] === grid[r+1][c]) return true;
        }
      return false;
    }

    function hasWon() {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] === WIN_VAL) return true;
      return false;
    }

    // ── Particles ──
    function spawnParticles(row, col, value) {
      var boardRect = board.getBoundingClientRect();
      var cellW = (boardRect.width - CELL_GAP * 3) / SIZE;
      var cellH = (boardRect.height - CELL_GAP * 3) / SIZE;
      var cx = boardRect.left + 8 + col * (cellW + CELL_GAP) + cellW / 2;
      var cy = boardRect.top  + 8 + row * (cellH + CELL_GAP) + cellH / 2;
      var colors = ['#FFD700','#FF6B00','#00F0FF','#FFFFFF','#3EE6A0'];
      for (var i = 0; i < 14; i++) {
        var p = document.createElement('div');
        p.className = 'fx-particle';
        var size = Math.random() * 6 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = colors[i % colors.length];
        p.style.left = cx + 'px';
        p.style.top  = cy + 'px';
        p.style.boxShadow = '0 0 6px ' + p.style.background;
        stage.appendChild(p);
        (function(el, delay) {
          setTimeout(function () { el.remove(); }, delay + 900);
        })(p, i * 30);
      }
    }

    // ── Render ──
    function renderBoard() {
      board.innerHTML = '';
      var frag = document.createDocumentFragment();
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = grid[r][c];
          const cell = document.createElement('div');
          cell.style.cssText = 'border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);';
          if (val !== 0) {
            const tile = document.createElement('div');
            tile.className = 'tile t-' + val;
            tile.textContent = val;
            cell.appendChild(tile);
          }
          frag.appendChild(cell);
        }
      }
      board.appendChild(frag);
    }

    // ── HUD ──
    function updateHUD() {
      $scoreHud.querySelector('.hud-value').textContent = String(score).padStart(6, '0');
      $bestHud.querySelector('.hud-value').textContent  = String(best).padStart(6, '0');
    }

    // ── Modal helpers ──
    function openModal(el) { el.classList.add('open'); }
    function closeModal(el) { el.classList.remove('open'); }

    // ── Execute move ──
    function execMove(dir) {
      if (state !== 'PLAY') return;
      var res;
      if (dir === 'left')  res = moveLeft();
      else if (dir === 'right') res = moveRight();
      else if (dir === 'up')    res = moveUp();
      else if (dir === 'down')  res = moveDown();
      else return;

      if (!res.moved) return;

      // Save undo state (first move only)
      if (!undoGrid) {
        undoGrid = grid.map(function(r) { return r.slice(); });
        undoScore = score;
      }

      score += res.merged;
      moveCount++;

      // Spawn new tile
      var spawned = addRandom();

      // Find merged cells for particles (simple heuristic: cells where value doubled)
      if (res.merged > 0 && spawned) {
        spawnParticles(spawned.r, spawned.c, grid[spawned.r][spawned.c]);
      }

      renderBoard();
      updateHUD();

      // Check win
      if (!won && hasWon()) {
        won = true;
        state = 'WIN';
        openModal($win);
        if (window.ArcadeAPI) ArcadeAPI.saveScore('2048', score, { meta: { level: moveCount } });
        localStorage.setItem('2048_best', String(Math.max(best, score)));
        return;
      }

      // Check lose
      if (!canMove()) {
        state = 'OVER';
        if (score > best) {
          best = score;
          localStorage.setItem('2048_best', String(best));
        }
        $overSub.textContent = 'امتیاز: ' + score;
        openModal($over);
        if (window.ArcadeAPI) ArcadeAPI.saveScore('2048', score, { meta: { reason: 'no-moves' } });
        return;
      }
    }

    // ── Input ──
    // Keyboard
    document.addEventListener('keydown', function (e) {
      if (state === 'READY') return;
      var map = {
        ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down'
      };
      if (map[e.key]) {
        e.preventDefault();
        execMove(map[e.key]);
      }
    });

    // Touch swipe
    var touchX = 0, touchY = 0;
    document.addEventListener('touchstart', function (e) {
      if (state !== 'PLAY') return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, {passive: true});

    document.addEventListener('touchend', function (e) {
      if (state !== 'PLAY') return;
      var dx = e.changedTouches[0].clientX - touchX;
      var dy = e.changedTouches[0].clientY - touchY;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (ax < 30 && ay < 30) return;
      if (ax > ay) {
        execMove(dx > 0 ? 'right' : 'left');
      } else {
        execMove(dy > 0 ? 'down' : 'up');
      }
    }, {passive: true});

    // ── Buttons ──
    document.getElementById('btnStart').addEventListener('click', function () {
      state = 'PLAY';
      closeModal($start);
    });

    document.getElementById('btnRestart').addEventListener('click', function () {
      init();
    });

    document.getElementById('btnWinContinue').addEventListener('click', function () {
      state = 'PLAY';
      keepPlaying = true;
      closeModal($win);
    });

    document.getElementById('btnWinNew').addEventListener('click', function () {
      init();
    });

    $newBtn.addEventListener('click', function () {
      init();
    });

    // Undo (one per game)
    document.addEventListener('keydown', function (e) {
      if (e.key === 'z' && undoGrid && state === 'PLAY') {
        grid = undoGrid;
        undoGrid = null;
        score = undoScore;
        updateHUD();
        renderBoard();
      }
    });

    // ── Start ──
    init();

  })();
  </script>
</body>
</html>
