<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinkie Pie Dino Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            image-rendering: pixelated;
        }
        .pixel-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="bg-pink-100 min-h-screen flex flex-col items-center justify-center p-2 md:p-6 text-slate-800">

    <div class="w-full max-w-4xl bg-white rounded-2xl p-4 md:p-6 shadow-2xl border-4 border-pink-300 relative flex flex-col items-center">
        
        <!-- Header & Scores -->
        <div class="w-full flex justify-between items-center mb-4 px-2 text-xs md:text-sm text-pink-600">
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-pink-500 rounded-full animate-ping"></span>
                <span class="font-bold tracking-wider">PINKIE RUNNER</span>
            </div>
            <div class="flex gap-4 md:gap-8 bg-pink-50 px-3 py-2 rounded-lg border border-pink-200">
                <div>HI <span id="highScore" class="text-pink-700">00000</span></div>
                <div>SCORE <span id="currentScore" class="text-pink-500">00000</span></div>
            </div>
        </div>

        <!-- Game Canvas Container -->
        <div class="relative w-full aspect-[21/9] min-h-[220px] bg-gradient-to-b from-sky-50 via-pink-50 to-pink-100 rounded-xl overflow-hidden border-2 border-pink-200">
            <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

            <!-- Game Over Overlay -->
            <div id="gameOverModal" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center text-white p-4">
                <h2 class="text-xl md:text-3xl text-pink-300 mb-2 font-bold tracking-wider drop-shadow-md">GAME OVER</h2>
                <p class="text-xs md:text-sm text-pink-100 mb-6">پونی خسته شد!</p>
                <button id="restartBtn" class="bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-bold py-3 px-6 rounded-xl border-b-4 border-pink-700 shadow-lg transition flex items-center gap-2 text-xs md:text-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    دوباره سعی کن (Space)
                </button>
            </div>

            <!-- Start Overlay -->
            <div id="startModal" class="absolute inset-0 bg-pink-500/10 backdrop-blur-[1px] flex flex-col items-center justify-center text-slate-700 p-4">
                <div class="bg-white/90 p-4 rounded-xl shadow-lg border border-pink-200 text-center max-w-sm">
                    <p class="text-xs md:text-sm mb-3 font-semibold text-pink-600">برای شروع کلیک کنید یا کلید Space را بزنید</p>
                    <div class="flex justify-center gap-3 text-[10px] text-slate-500">
                        <span class="bg-slate-100 px-2 py-1 rounded border">Space / ⬆ : پرش</span>
                        <span class="bg-slate-100 px-2 py-1 rounded border">⬇ : خم شدن</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Guide / Touch UI for Mobile -->
        <div class="w-full grid grid-cols-2 gap-3 mt-4 md:hidden">
            <button id="mobileDuckBtn" class="bg-pink-200 active:bg-pink-300 text-pink-800 font-bold py-4 rounded-xl text-center text-xs border-b-4 border-pink-400">
                ⬇ خم شدن (DUCK)
            </button>
            <button id="mobileJumpBtn" class="bg-pink-500 active:bg-pink-600 text-white font-bold py-4 rounded-xl text-center text-xs border-b-4 border-pink-700">
                ⬆ پرش (JUMP)
            </button>
        </div>

        <!-- Footer Info -->
        <div class="mt-4 text-[10px] text-pink-400 text-center">
            طراحی شده با HTML5 Canvas و Vector Sprite اختصاصی Pinkie Pie
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const startModal = document.getElementById('startModal');
        const restartBtn = document.getElementById('restartBtn');
        const mobileJumpBtn = document.getElementById('mobileJumpBtn');
        const mobileDuckBtn = document.getElementById('mobileDuckBtn');

        // ---- Internal Game Resolution ----
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 300;
        const GROUND_Y = 240;          // خط زمین (پاها اینجا قرار می‌گیرند)
        const TAU = Math.PI * 2;

        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // ---- Game State ----
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let highScore = Number(localStorage.getItem('pinkie_runner_hi')) || 0;
        let gameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];
        let clouds = [];

        highScoreEl.innerText = String(Math.floor(highScore)).padStart(5, '0');

        const keys = { jump: false, duck: false };

        /* =========================================================
           PINKIE PIE  —  اسپرایت بازنویسی‌شده
           مبدأ مختصات = نقطه‌ی تماس پاها با زمین (y=0 همان زمین است)
           ========================================================= */
        class PinkiePie {
            constructor() {
                this.x = 70;
                this.groundY = GROUND_Y;
                this.y = this.groundY;      // ← پاها دقیقاً روی زمین
                this.width = 46;
                this.height = 64;

                this.vy = 0;
                this.gravity = 0.68;
                this.jumpPower = -13;

                this.isJumping = false;
                this.isDucking = false;
                this.legFrame = 0;

                this.blinkTimer = 0;
                this.eyeOpen = 1;

                this.colors = {
                    body:      '#FFB6C1',
                    bodyShade: '#F095B0',
                    hoof:      '#D2748F',
                    hoofDark:  '#B85E78',
                    mane:      '#FF1493',
                    maneLight: '#FF69B4',
                    maneDark:  '#C71585',
                    iris:      '#00BFFF',
                    pupil:     '#232340'
                };
            }

            jump() {
                if (this.isJumping) return;
                this.isDucking = false;
                this.height = 64;
                this.vy = this.jumpPower;
                this.isJumping = true;
            }

            duck(shouldDuck) {
                if (this.isJumping) return;
                if (this.isDucking === shouldDuck) return;
                this.isDucking = shouldDuck;
                this.height = shouldDuck ? 40 : 64;
            }

            update() {
                if (this.isJumping) {
                    this.vy += this.gravity;
                    this.y += this.vy;
                    if (this.y >= this.groundY) {
                        this.y = this.groundY;
                        this.vy = 0;
                        this.isJumping = false;
                    }
                } else {
                    this.legFrame += 0.22 + gameSpeed * 0.014;
                }

                // پلک زدن
                this.blinkTimer++;
                const cyc = this.blinkTimer % 210;
                this.eyeOpen = cyc > 198 ? 0.12 : 1;
            }

            /* ---------- ابزار کمکی ---------- */
            drawLeg(x, y, w, h, bodyColor, hoofColor) {
                ctx.fillStyle = bodyColor;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 3);
                ctx.fill();

                ctx.fillStyle = hoofColor;
                ctx.beginPath();
                ctx.roundRect(x, y + h - 5, w, 5, 2);
                ctx.fill();
            }

            drawEye(cx, cy) {
                const c = this.colors;
                const o = this.eyeOpen;

                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(cx, cy, 5.4, 7 * o, 0, 0, TAU);
                ctx.fill();

                ctx.fillStyle = c.iris;
                ctx.beginPath();
                ctx.ellipse(cx + 1.4, cy, 3.3, 5.2 * o, 0, 0, TAU);
                ctx.fill();

                ctx.fillStyle = c.pupil;
                ctx.beginPath();
                ctx.ellipse(cx + 2, cy, 1.8, 3 * o, 0, 0, TAU);
                ctx.fill();

                if (o > 0.5) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(cx + 0.2, cy - 3.2, 1.6, 0, TAU);
                    ctx.fill();
                }
            }

            drawCutieMark(cx, cy) {
                ctx.save();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(cx - 3,   cy - 3.5); ctx.lineTo(cx, cy + 3);
                ctx.moveTo(cx + 3.5, cy - 2);   ctx.lineTo(cx, cy + 3);
                ctx.moveTo(cx + 0.5, cy - 4.5); ctx.lineTo(cx, cy + 3);
                ctx.stroke();

                ctx.fillStyle = '#00BFFF';
                ctx.beginPath(); ctx.ellipse(cx - 3,   cy - 4.5, 2.2, 2.8, -0.25, 0, TAU); ctx.fill();
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.ellipse(cx + 3.5, cy - 3,   2.2, 2.8,  0.25, 0, TAU); ctx.fill();
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath(); ctx.ellipse(cx + 0.5, cy - 5.5, 2.2, 2.8,  0,    0, TAU); ctx.fill();
                ctx.restore();
            }

            /* ---------- رسم ---------- */
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.isDucking) this.drawDuck();
                else this.drawRun();
                ctx.restore();
            }

            // ---------- حالت دویدن / ایستاده ----------
            drawRun() {
                const c = this.colors;
                const swing = this.isJumping ? 6 : Math.sin(this.legFrame) * 7;
                const legTop = -20;
                const legH = 20;

                /* ===== دُم پفکی ===== */
                ctx.fillStyle = c.mane;
                ctx.beginPath();
                ctx.arc(-19, -38, 10, 0, TAU);
                ctx.arc(-29, -32, 12, 0, TAU);
                ctx.arc(-27, -20, 10, 0, TAU);
                ctx.arc(-16, -24,  8, 0, TAU);
                ctx.fill();
                ctx.fillStyle = c.maneLight;
                ctx.beginPath(); ctx.arc(-29, -31, 5, 0, TAU); ctx.fill();

                /* ===== پاهای دور (تیره‌تر) ===== */
                this.drawLeg(-16 + swing, legTop, 8, legH, c.bodyShade, c.hoofDark);
                this.drawLeg(  2 - swing, legTop, 8, legH, c.bodyShade, c.hoofDark);

                /* ===== بدن ===== */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(-2, -28, 18, 12.5, 0, 0, TAU);
                ctx.fill();

                this.drawCutieMark(-4, -32);

                /* ===== پاهای نزدیک (روشن‌تر) ===== */
                this.drawLeg(-8 - swing, legTop, 8, legH, c.body, c.hoof);
                this.drawLeg(10 + swing, legTop, 8, legH, c.body, c.hoof);

                /* ===== گردن ===== */
                ctx.strokeStyle = c.body;
                ctx.lineWidth = 15;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(4, -34);
                ctx.lineTo(13, -46);
                ctx.stroke();

                /* ===== سر ===== */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(20, -52, 12.5, 13.5, 0, 0, TAU);
                ctx.fill();

                /* ===== یال پفکی ===== */
                ctx.fillStyle = c.mane;
                ctx.beginPath();
                ctx.arc(26, -64, 8.5, 0, TAU);
                ctx.arc(15, -66, 10,  0, TAU);
                ctx.arc( 6, -60,  9,  0, TAU);
                ctx.arc( 3, -50,  8,  0, TAU);
                ctx.arc( 6, -40,  7,  0, TAU);
                ctx.fill();
                ctx.fillStyle = c.maneLight;
                ctx.beginPath();
                ctx.arc(14, -66, 5, 0, TAU);
                ctx.arc( 4, -59, 4, 0, TAU);
                ctx.fill();

                /* ===== گوش ===== */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.moveTo(21, -63);
                ctx.lineTo(24, -74);
                ctx.lineTo(30, -64);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = c.bodyShade;
                ctx.beginPath();
                ctx.moveTo(23.5, -64);
                ctx.lineTo(24.8, -70.5);
                ctx.lineTo(28,   -64.5);
                ctx.closePath();
                ctx.fill();

                /* ===== پوزه ===== */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(31, -46, 6, 5.5, 0, 0, TAU);
                ctx.fill();

                ctx.fillStyle = c.hoof;
                ctx.beginPath(); ctx.arc(33, -47, 1.1, 0, TAU); ctx.fill();

                ctx.strokeStyle = c.maneDark;
                ctx.lineWidth = 1.4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(31, -44, 3.5, 0.35, Math.PI * 0.85);
                ctx.stroke();

                /* ===== چشم ===== */
                this.drawEye(25, -55);
            }

            // ---------- حالت خم شدن ----------
            drawDuck() {
                const c = this.colors;

                /* دُم */
                ctx.fillStyle = c.mane;
                ctx.beginPath();
                ctx.arc(-26, -22,  9, 0, TAU);
                ctx.arc(-33, -15, 10, 0, TAU);
                ctx.arc(-28,  -8,  8, 0, TAU);
                ctx.fill();

                /* پاهای دور */
                ctx.fillStyle = c.bodyShade;
                ctx.beginPath(); ctx.roundRect(-30, -10, 24, 10, 4); ctx.fill();
                ctx.beginPath(); ctx.roundRect(  6, -10, 24, 10, 4); ctx.fill();

                /* بدن کشیده */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(0, -18, 23, 11, 0, 0, TAU);
                ctx.fill();

                this.drawCutieMark(-7, -23);

                /* پاهای نزدیک */
                ctx.fillStyle = c.body;
                ctx.beginPath(); ctx.roundRect(-24, -9, 24, 9, 4); ctx.fill();
                ctx.beginPath(); ctx.roundRect( 12, -9, 24, 9, 4); ctx.fill();

                /* گردن */
                ctx.strokeStyle = c.body;
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(13, -21);
                ctx.lineTo(22, -26);
                ctx.stroke();

                /* سر */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(29, -29, 11.5, 11.5, 0, 0, TAU);
                ctx.fill();

                /* یال */
                ctx.fillStyle = c.mane;
                ctx.beginPath();
                ctx.arc(33, -39,  8, 0, TAU);
                ctx.arc(23, -40,  9, 0, TAU);
                ctx.arc(15, -34,  8, 0, TAU);
                ctx.arc(14, -24,  7, 0, TAU);
                ctx.fill();
                ctx.fillStyle = c.maneLight;
                ctx.beginPath(); ctx.arc(22, -40, 4.5, 0, TAU); ctx.fill();

                /* گوش */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.moveTo(28, -38);
                ctx.lineTo(30, -46);
                ctx.lineTo(34, -37);
                ctx.closePath();
                ctx.fill();

                /* پوزه */
                ctx.fillStyle = c.body;
                ctx.beginPath();
                ctx.ellipse(38, -24, 5.5, 5, 0, 0, TAU);
                ctx.fill();

                ctx.fillStyle = c.hoof;
                ctx.beginPath(); ctx.arc(39.5, -25, 1, 0, TAU); ctx.fill();

                ctx.strokeStyle = c.maneDark;
                ctx.lineWidth = 1.3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(38, -23, 3, 0.35, Math.PI * 0.85);
                ctx.stroke();

                /* چشم */
                this.drawEye(33, -31);
            }

            /* ---------- هیتباکس ---------- */
            getBounds() {
                if (this.isDucking) {
                    return { x: this.x - 16, y: this.y - 40, width: 54, height: 40 };
                }
                return { x: this.x - 6, y: this.y - 60, width: 44, height: 60 };
            }
        }

        /* =========================================================
           موانع
           ========================================================= */
        class Obstacle {
            constructor(type) {
                this.type = type; // 'cactus' | 'partyHat' | 'flyingParty'
                this.markedForDeletion = false;

                if (type === 'cactus') {
                    this.width  = 26 + Math.random() * 16;
                    this.height = 42 + Math.random() * 14;
                    this.x = GAME_WIDTH + this.width;
                    this.y = GROUND_Y - this.height;
                } else if (type === 'partyHat') {
                    this.width  = 30;
                    this.height = 44;
                    this.x = GAME_WIDTH + this.width;
                    this.y = GROUND_Y - this.height;
                } else if (type === 'flyingParty') {
                    this.width  = 36;
                    this.height = 30;
                    this.x = GAME_WIDTH + this.width;
                    // ارتفاع بالا → باید خم شوی | ارتفاع پایین → باید بپری
                    this.y = Math.random() > 0.5 ? GROUND_Y - 80 : GROUND_Y - 40;
                    this.wingAngle = 0;
                }
            }

            update() {
                this.x -= gameSpeed;
                if (this.x + this.width < -60) this.markedForDeletion = true;
                if (this.type === 'flyingParty') this.wingAngle += 0.15;
            }

            draw() {
                ctx.save();
                if (this.type === 'cactus') {
                    ctx.fillStyle = '#55C183';
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                    ctx.fill();
                    ctx.fillStyle = '#389B61';
                    ctx.fillRect(this.x + 5, this.y + 7, 3, this.height - 14);
                    // گل کوچک روی کاکتوس
                    ctx.fillStyle = '#FFB6C1';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width - 7, this.y + 9, 3.5, 0, TAU);
                    ctx.fill();
                } else if (this.type === 'partyHat') {
                    ctx.fillStyle = '#FF69B4';
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width / 2, this.y);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.lineTo(this.x, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, this.y, 5, 0, TAU);
                    ctx.fill();
                    // راه راه
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fillRect(this.x + 8, this.y + this.height - 16, this.width - 16, 4);
                } else if (this.type === 'flyingParty') {
                    const hover = Math.sin(this.wingAngle) * 4;
                    ctx.fillStyle = '#FF4500';
                    ctx.beginPath();
                    ctx.ellipse(this.x + 18, this.y + 15 + hover, 14, 10, 0, 0, TAU);
                    ctx.fill();
                    ctx.strokeStyle = '#8A8A8A';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 6, this.y + 15 + hover);
                    ctx.lineTo(this.x - 6, this.y + 20 + hover);
                    ctx.stroke();
                }
                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x + 3,
                    y: this.y + 3,
                    width:  this.width  - 6,
                    height: this.height - 6
                };
            }
        }

        /* =========================================================
           ابرها
           ========================================================= */
        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = 30 + Math.random() * 70;
                this.width = 50 + Math.random() * 40;
                this.speed = 0.5 + Math.random() * 0.8;
                this.markedForDeletion = false;
            }
            update() {
                this.x -= this.speed;
                if (this.x < -100) this.markedForDeletion = true;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.beginPath();
                ctx.arc(this.x,      this.y,      15, 0, TAU);
                ctx.arc(this.x + 15, this.y - 8,  18, 0, TAU);
                ctx.arc(this.x + 35, this.y,      14, 0, TAU);
                ctx.fill();
            }
        }

        /* =========================================================
           منطق بازی
           ========================================================= */
        const player = new PinkiePie();

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.width &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.height &&
                r1.y + r1.height > r2.y
            );
        }

        function spawnObstacles() {
            if (frameCount % Math.max(48, Math.floor(112 - gameSpeed * 3)) === 0) {
                if (Math.random() < 0.72) {
                    const types = ['cactus', 'partyHat'];
                    obstacles.push(new Obstacle(types[Math.floor(Math.random() * types.length)]));
                } else if (score > 150) {
                    obstacles.push(new Obstacle('flyingParty'));
                }
            }
            if (frameCount % 180 === 0) clouds.push(new Cloud());
        }

        function drawGround() {
            // خط اصلی زمین
            ctx.strokeStyle = '#F472B6';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(GAME_WIDTH, GROUND_Y);
            ctx.stroke();

            // بافت متحرک زیر زمین
            ctx.fillStyle = '#F9A8D4';
            const offset = (frameCount * gameSpeed) % 40;
            for (let i = -40; i < GAME_WIDTH + 40; i += 40) {
                const x = i - offset;
                ctx.fillRect(x,      GROUND_Y + 8,  16, 3);
                ctx.fillRect(x + 22, GROUND_Y + 18,  8, 3);
                ctx.fillRect(x + 10, GROUND_Y + 30, 12, 3);
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // ابرها
            clouds.forEach(cl => { cl.update(); cl.draw(); });
            clouds = clouds.filter(cl => !cl.markedForDeletion);

            // زمین
            drawGround();

            if (isPlaying && !isGameOver) {
                frameCount++;
                score += 0.15;
                gameSpeed += 0.0008;

                currentScoreEl.innerText = String(Math.floor(score)).padStart(5, '0');

                player.duck(keys.duck);
                player.update();

                spawnObstacles();

                obstacles.forEach(ob => {
                    ob.update();
                    ob.draw();
                    if (checkCollision(player.getBounds(), ob.getBounds())) {
                        triggerGameOver();
                    }
                });

                obstacles = obstacles.filter(ob => !ob.markedForDeletion);
            }

            player.draw();
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            isGameOver = true;
            isPlaying = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pinkie_runner_hi', Math.floor(highScore));
                highScoreEl.innerText = String(Math.floor(highScore)).padStart(5, '0');
            }

            gameOverModal.classList.remove('hidden');
            if (window.ArcadeAPI) ArcadeAPI.saveScore('pony', score);
        }

        function resetGame() {
            score = 0;
            gameSpeed = 6;
            frameCount = 0;
            obstacles = [];
            clouds = [];
            isGameOver = false;
            isPlaying = true;

            gameOverModal.classList.add('hidden');
            startModal.classList.add('hidden');

            // ریست کامل پونی (پاها روی زمین)
            player.y = player.groundY;
            player.vy = 0;
            player.isJumping = false;
            player.isDucking = false;
            player.height = 64;
            player.legFrame = 0;
            player.blinkTimer = 0;
            player.eyeOpen = 1;
            keys.duck = false;
        }

        /* ---------- کنترل‌ها ---------- */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!isPlaying || isGameOver) resetGame();
                else player.jump();
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                keys.duck = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') keys.duck = false;
        });

        canvas.addEventListener('click', () => {
            if (!isPlaying || isGameOver) resetGame();
            else player.jump();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        mobileJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isPlaying || isGameOver) resetGame();
            else player.jump();
        });

        mobileDuckBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys.duck = true;
        });

        mobileDuckBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys.duck = false;
        });

        /* ---------- شروع ---------- */
        window.onload = function () {
            for (let i = 0; i < 4; i++) {
                const c = new Cloud();
                c.x = Math.random() * GAME_WIDTH;
                clouds.push(c);
            }
            gameLoop();
        };
    </script>
<script src="./score.js"></script>
</body>
</html>
